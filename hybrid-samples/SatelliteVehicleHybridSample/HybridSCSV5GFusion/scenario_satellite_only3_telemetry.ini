# ==============================================================================
# SCENARIO: SATELLITE TELEMETRY VARIABLE
# Variable rate vehicular telemetry via satellite
# ==============================================================================

[Config SatelliteOnlyVehicleTelemetryVariable]
extends = SatelliteOnly
description = "Variable rate vehicular telemetry"

# ==============================================================================
# APPLICATION CONFIGURATION - VARIABLE TELEMETRY
# ==============================================================================
# Server
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

# Nodes - Variable payload and exponential interval
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].messageLength = intuniform(256B, 1024B)  # Variable payload
*.node[*].app[0].sendInterval = exponential(1s)  # Exponential interval

# Staggered start times
*.node[0].app[0].startTime = 5s
*.node[1].app[0].startTime = 5.25s
*.node[2].app[0].startTime = 5.50s
*.node[3].app[0].startTime = 5.75s

# *.node[*].app[0].stopTime = 25s
