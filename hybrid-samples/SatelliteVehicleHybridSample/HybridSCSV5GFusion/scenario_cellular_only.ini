# ==============================================================================
# SCENARIO: CELLULAR ONLY
# HybridCar using only cellular network (Satellite disabled)
# ==============================================================================

[Config CellularOnly]
description = "HybridCar: Cellular Only (Satellite disabled)"

# ==============================================================================
# VEINS MANAGER
# ==============================================================================
*.manager.moduleType = "SatelliteVehicleHybridSample.HybridSCSV5GFusion.HybridCarV2X"
*.manager.updateInterval = 0.2s

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
# Enable cellular, disable satellite
*.node[*].hasCellular = true
*.node[*].numWlanInterfaces = 0
*.node[*].ipv4.configurator.interfaces = "cellular"

# ==============================================================================
# SIMU5G CELLULAR PARAMETERS
# ==============================================================================
*.node[*].nodeType = "UE"
*.node[*].masterId = 1  # eNodeB ID
*.node[*].macCellId = 1 # LTE cell ID
*.node[*].macNodeId = ancestorIndex(0)

# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("netconfig_cellular.xml")
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dump_cellular.xml"

# ==============================================================================
# MOBILITY
# ==============================================================================
*.node[*].mobility.initialX = 290m
*.node[*].mobility.initialY = 350m

# ==============================================================================
# APPLICATION CONFIGURATION
# ==============================================================================
# Server
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

# Nodes
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].localPort = 5030
*.node[*].app[0].messageLength = 100B
*.node[*].app[0].sendInterval = 1s
*.node[*].app[0].startTime = 3s
*.node[*].app[0].stopTime = ${simTimeLimit}s
