# ==============================================================================
# SCENARIO: SATELLITE BURST TRAFFIC
# Burst data upload via satellite
# ==============================================================================

[Config SatelliteOnlyBurstTraffic]
extends = SatelliteOnly
description = "Burst data upload via satellite"

# ==============================================================================
# APPLICATION CONFIGURATION - BURST TRAFFIC
# ==============================================================================
# Server
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

# Nodes - Burst pattern with large chunks
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].messageLength = 8192B  # 8KB chunks
*.node[*].app[0].sendInterval = exponential(500ms)  # Burst pattern

# Each node bursts at different times
*.node[0].app[0].startTime = 5s
# *.node[0].app[0].stopTime = 10s  # 5-second burst

*.node[1].app[0].startTime = 11s
#*.node[1].app[0].stopTime = 16s

*.node[2].app[0].startTime = 17s
# *.node[2].app[0].stopTime = 22s

*.node[3].app[0].startTime = 23s
#*.node[3].app[0].stopTime = 28s
