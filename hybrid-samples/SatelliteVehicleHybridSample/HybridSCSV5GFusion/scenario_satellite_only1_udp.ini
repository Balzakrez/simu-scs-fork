# ==============================================================================
# SCENARIO: SATELLITE UDP TRAFFIC
# Test UDP traffic HybridCar -> server via satellite
# ==============================================================================

[Config SatelliteOnlyUdpTraffic]
extends = SatelliteOnly
description = "Test UDP traffic HybridCar -> server via satellite"

# ==============================================================================
# APPLICATION CONFIGURATION - UDP
# ==============================================================================
# Server (already configured in base, but explicit)
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

# Nodes - UDP traffic instead of Ping
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].messageLength = 1024B  # 1KB payload
*.node[*].app[0].sendInterval = 100ms   # 10 packets/sec

# Node 0: starts at 5s
*.node[0].app[0].startTime = 5s
# *.node[0].app[0].stopTime = 25s

# Node 1: starts at 6s (offset to avoid collisions)
*.node[1].app[0].startTime = 6s
# *.node[1].app[0].stopTime = 26s

# Node 2: starts at 7s
*.node[2].app[0].startTime = 7s
# *.node[2].app[0].stopTime = 27s

# Node 3: starts at 8s
*.node[3].app[0].startTime = 8s
# *.node[3].app[0].stopTime = 28s
