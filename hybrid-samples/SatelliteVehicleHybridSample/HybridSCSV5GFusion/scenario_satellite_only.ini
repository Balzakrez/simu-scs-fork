# ==============================================================================
# SCENARIO: SATELLITE ONLY
# HybridCar using only satellite network (Cellular disabled)
# ==============================================================================

[Config SatelliteOnly]
description = "HybridCar: Satellite Only"

# ==============================================================================
# VEINS MANAGER
# ==============================================================================
*.manager.moduleType = "SatelliteVehicleHybridSample.HybridSCSV5GFusion.HybridCarV2X"
*.manager.updateInterval = 0.2s

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
# Enable satellite, Disable cellular and use only WLAN
*.node[*].numWlanInterfaces = 1
*.node[*].hasCellular = false
*.numUe = 0
*.node[*].ipv4.configurator.interfaces = "wlan0"

# ==============================================================================
# SATELLITE ROUTING
# ==============================================================================
*.satellite[*].forwarding = true  
*.satellite[*].ipv4.forwarding = true

# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("netconfig_satellite.xml")
*.configurator.updateInterval = 0.2s
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dump_sat.xml"

# ==============================================================================
# APPLICATION CONFIGURATION - PING
# ==============================================================================
# Server
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

# Nodes - Staggered ping to avoid collisions
*.node[*].numApps = 1
*.node[*].app[0].typename = "PingApp"
*.node[*].app[0].destAddr = "server"
*.node[*].app[0].localPort = 5000 + ancestorIndex(0)
*.node[*].app[0].printPing = true

# Node 0: starts at 5s
*.node[0].app[0].startTime = 5s
# *.node[0].app[0].stopTime = 25s
*.node[0].app[0].sendInterval = 4s

# Node 1: starts at 6s (1s offset)
*.node[1].app[0].startTime = 6s
# *.node[1].app[0].stopTime = 26s
*.node[1].app[0].sendInterval = 4s

# Node 2: starts at 7s (2s offset)
*.node[2].app[0].startTime = 7s
# *.node[2].app[0].stopTime = 27s
*.node[2].app[0].sendInterval = 4s

# Node 3: starts at 8s (3s offset)
*.node[3].app[0].startTime = 8s
# *.node[3].app[0].stopTime = 28s
*.node[3].app[0].sendInterval = 4s
