# ==============================================================================
# CELLULAR NETWORK CONFIGURATION
# 4G LTE Settings
# ==============================================================================

# Note: numBands = Number of Resource Blocks (RB) in a Single Cell
# 1RB = 180kHz 

# **.numBands = 50 # 50RB x 180kHZ = 9MHz (for testing) 
# **.numBands = 15 # 15RB x 180kHZ = 2.7MHz (for testing)

# ==============================================================================
# ENODEB (BASE STATION) CONFIGURATION
# ==============================================================================
# eNodeB Mobility & Position
*.eNB.mobility.initFromDisplayString = false
*.eNB.mobility.initialX = 300m
*.eNB.mobility.initialY = 300m

# eNodeB Cell Configuration (Single Cell Scenario)
*.eNB.macCellId = 1
*.eNB.macNodeId = 1

# eNodeB Network Interface (D2D Capability)
*.eNB.cellularNic.d2dCapable = false

# eNodeB Dual Connectivity (EN-DC)
*.eNB.cellularNic.dualConnectivityEnabled = false

# ==============================================================================
# PWG (PACKET GATEWAY) CONFIGURATION
# ==============================================================================
# Packet Filtering
*.pwg.pwgFilterMode = "ALL" # Filter mode: ALL, TCP, UDP