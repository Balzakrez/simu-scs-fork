# ==============================================================================
# HYBRID TERRESTRIAL-NON-TERRESTRIAL NETWORK SIMULATION
# Configuration file for testing Universal and Legacy visualization modes
# ==============================================================================

# ==============================================================================
# BASE CONFIGURATION
# ==============================================================================
# [General]
# --- Simulation Control ---
sim-time-limit = ${simTimeLimit=500}s
repeat = 1
seed-set = ${repetition}

# --- Network ---
network = HybridFusionNet
image-path = "../../images"

# --- Output ---
result-dir = "../results"
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
cmdenv-express-mode = true

# --- Statistics ---
**.vector-recording = true
**.scalar-recording = true

# --- Global Parameters ---
**.numBands = 50
**.mobility.updateFromDisplayString = false

# --- Constraint Area (Updated per config) ---
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 0m

# ==============================================================================
# UNIVERSAL MODE - NAPOLI (Full World Map 1:1)
# ==============================================================================
# [Config Universal]
# extends = General

# --- SUMO Integration ---
*.Pos.sumoNetFile = "../sumodir/napoli/napoli_fixed.net.xml"

# --- World Map Image Dimensions ---
*.Pos.mapx = 2160.0      # World map image width (pixels)
*.Pos.mapy = 1080.0      # World map image height (pixels)

# --- Display Configuration ---
*.Pos.worldMapDisplayWidth = 2160.0  # Display width = 1:1 scale
*.Pos.offsetX = 1500.0               # World map starts after SUMO map + gap

# --- SUMO Map Dimensions (Auto-loaded from .net.xml, can override) ---
*.Pos.emapx = 1373.0     # SUMO map width (meters)
*.Pos.emapy = 985.0      # SUMO map height (meters)

# --- Universal Mode Settings (offset_x/y = 0) ---
*.Pos.universalMode = true
*.Pos.offset_x = 0       # Universal mode: no crop
*.Pos.offset_y = 0       # Universal mode: no crop
*.Pos.mapx2 = 0          # Ignored in Universal mode
*.Pos.mapy2 = 0          # Ignored in Universal mode

# --- Playground & Constraint ---
# playgroundSizeX = SUMO_map + gap + World_map = 1373 + 127 + 2160 ≈ 3660m
*.playgroundSizeX = 3660m
*.playgroundSizeY = 1080m  # Use world map height
*.playgroundSizeZ = 50m

**.constraintAreaMaxX = 3660m
**.constraintAreaMaxY = 1080m

# --- Ground Station (Napoli) ---
*.MCC[*].cityName = "NapoliMCC"
*.MCC[*].mobility.latitude = 40.830598
*.MCC[*].mobility.longitude = 14.219833

# --- Satellite Configuration ---
*.satellite[*].satelliteName = "STARLINK-TEST"
*.satellite[*].NoradModule.TLEfile = "starlinktest.txt"
*.satellite[*].NoradModule.satIndex = parentIndex()
*.satellite[*].NoradModule.satName = "sat"
*.satellite[*].NoradModule.planes = 2
*.satellite[*].NoradModule.satPerPlane = 66
*.satellite[*].mobility.targetyear = 123
*.satellite[*].mobility.targetmonth = 2
*.satellite[*].mobility.targetday = 2
*.satellite[*].mobility.targethour = 12
*.satellite[0].mobility.targetmin = 10
*.satellite[*].mobility.targetsec = 0
*.satellite[*].mobility.enableRepeatCycle = 1
*.satellite[*].mobility.targetwday = 4
*.satellite[*].mobility.targetyday = 60
*.satellite[*].mobility.cycleTime = 360

