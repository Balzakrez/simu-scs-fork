# ==============================================================================
# Configuration: HYBRID SWITCHING - TIME BASED
# HybridCar using both interfaces with time-based switching
# ==============================================================================

[Config TimeBasedBaseline]
description = "HybridCar: Switching every 60s (Satellite First)"

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
# Enable BOTH interfaces: satellite (wlan0) + cellular
*.node[*].numWlanInterfaces = 1
*.node[*].hasCellular = true
*.node[*].ipv4.configurator.interfaces = "wlan0 cellular"

# Enable HybridInterfaceManager
*.node[*].enableSwitching = true

# ==============================================================================
# HYBRID INTERFACE MANAGER CONFIGURATION
# ==============================================================================
# Switching Mode & Interface Names
*.node[*].interfaceManager.switchingMode = "time-based"
*.node[*].interfaceManager.satInterfaceName = "wlan0"
*.node[*].interfaceManager.cellInterfaceName = "cellular"
*.node[*].interfaceManager.startWithSatellite = false # Start with Cellular

# Time Strategy Parameters
*.node[*].interfaceManager.switchInterval = 60s # Switching interval

# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("../config_networks/netconfig_hybrid.xml")
*.configurator.updateInterval = 1s # Enable frequent updates for interface state changes

# Dump for debugging
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dumps/dump_hybrid_time.xml"

# ==============================================================================
# UPDATE INTERVALS
# ==============================================================================
*.manager.updateInterval = 0.2s                # Veins Manager
*.satellite[*].mobility.updateInterval = 1s    # Satellite
*.MCC[*].mobility.updateInterval = 200s        # MCC
**.updateInterval = 0.1s                       # General

# ==============================================================================
# APPLICATION CONFIGURATION - UDP
# ==============================================================================
# Server Application
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000
# Node Application - Continuous traffic to observe switching behavior
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].localPort = 5030
*.node[*].app[0].messageLength = 8192B # 8KB chunks
*.node[*].app[0].sendInterval = exponential(100ms) # Burst pattern with mean 500ms
*.node[*].app[0].startTime = 5s + ancestorIndex(0) * 2s # 2s offset per vehicle (staggered start)
*.node[*].app[0].stopTime = ${simTimeLimit}s
# Alternative Traffic Patterns (Commented)
# *.node[*].app[0].sendInterval = uniform(0.5s, 1.5s)  # Uniform traffic
# *.node[*].app[0].startTime = uniform(5s, 10s)  # Random start

# ==============================================================================
# SCENARIO VARIANTS
# ==============================================================================

[Config TimeBasedSwitchingFast]
extends = TimeBasedBaseline
description = "HybridCar: Fast switching every 30s (Satellite First)"

*.node[*].interfaceManager.switchInterval = 30s

# ==============================================================================

[Config TimeBasedSwitchingStartSat]
extends = TimeBasedBaseline
description = "HybridCar: Switching every 60s and Start with Satellite active"

*.node[*].interfaceManager.startWithSatellite = true