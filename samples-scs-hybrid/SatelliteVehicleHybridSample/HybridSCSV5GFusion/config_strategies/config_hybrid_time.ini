# ==============================================================================
# Configuration: HYBRID SWITCHING
# HybridCar using both interfaces (Satellite + Cellular) with time-based switching
# ==============================================================================

[Config TimeBasedSwitching]
description = "HybridCar: Hybrid mode with time-based hard switching (60s interval)"

# ==============================================================================
# VEINS MANAGER
# ==============================================================================
*.manager.moduleType = "SatelliteVehicleHybridSample.HybridSCSV5GFusion.HybridCarV2X"

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
# Enable BOTH interfaces: satellite (wlan0) + cellular
*.node[*].numWlanInterfaces = 1
*.node[*].hasCellular = true

# Tell IPv4 configurator about both interfaces
*.node[*].ipv4.configurator.interfaces = "wlan0 cellular"

# Enable HybridInterfaceManager
*.node[*].enableSwitching = true
# ==============================================================================
# HYBRID INTERFACE MANAGER CONFIGURATION
# ==============================================================================
# Switching mode : "time-based"
*.node[*].interfaceManager.switchingMode = "time-based"

# Interface names (must match actual interface names in the node)
*.node[*].interfaceManager.satInterfaceName = "wlan0"
*.node[*].interfaceManager.cellInterfaceName = "cellular"

# Starting interface: false = start with Cellular, true = start with Satellite
*.node[*].interfaceManager.startWithSatellite = false

# Time Strategy Parameters (in HybridInterfaceManager.ned)
# ----------------------------
# Switching interval (seconds)
*.node[*].interfaceManager.switchInterval = 60s

# ==============================================================================
# SIMU5G CELLULAR PARAMETERS
# ==============================================================================
*.node[*].nodeType = "UE"
*.node[*].masterId = 1      # eNodeB ID
*.node[*].macCellId = 1     # LTE cell ID
*.node[*].macNodeId = ancestorIndex(0)

# ==============================================================================
# SATELLITE CONFIGURATION
# ==============================================================================
*.satellite[*].forwarding = true  
*.satellite[*].ipv4.forwarding = true

# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("../config_networks/netconfig_hybrid.xml")

# Enable frequent updates to react to interface state changes
# *.configurator.updateInterval = 1s

# Dump for debugging
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dumps/dump_hybrid_time.xml" # Output dump file

# ==============================================================================
# UPDATE INTERVALS
# ==============================================================================
# Veins Manager (vehicle) mobility update interval
*.manager.updateInterval = 0.2s

# Satellite and MCC mobility update interval
*.satellite[*].mobility.updateInterval = 1s
*.MCC[*].mobility.updateInterval = 200s

# General Mobility Update
**.updateInterval = 0.1s

# Configurator IP update interval
*.configurator.updateInterval = 1s

# ==============================================================================
# APPLICATION CONFIGURATION - UDP
# ==============================================================================
# Server
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

# Nodes - Continuous traffic to observe switching behavior
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].localPort = 5030
*.node[*].app[0].messageLength = 8192B  # 8KB chunks

# Note: Important for avoid collisions during communication
# *.node[*].app[0].sendInterval = uniform(0.5s, 1.5s)  # Uniform traffic from 0.5s to 1.5s
# *.node[*].app[0].startTime = uniform(5s, 10s)  # Random start
*.node[*].app[0].sendInterval = exponential(500ms)  # Burst pattern with mean 500ms
*.node[*].app[0].startTime =  5s + ancestorIndex(0) * 2s  # 2s offset per vehicle (Staggered start)

*.node[*].app[0].stopTime = ${simTimeLimit}s


# ==============================================================================
# SCENARIO: TIME-BASED SWITCHING - PING
# Use ping instead of UDP to measure latency during switching
# ==============================================================================
[Config TimeBasedSwitchingPing]
extends = TimeBasedSwitching
description = "HybridCar: Ping-based traffic for latency measurement"

# Server - still use UdpSink (ping uses ICMP, not UDP, but server needs to respond)
*.server.numApps = 0

# Nodes - Staggered ping to observe switching latency
*.node[*].numApps = 1
*.node[*].app[0].typename = "PingApp"
*.node[*].app[0].destAddr = "server"
*.node[*].app[0].printPing = true

# ==============================================================================
# SCENARIO: TIME-BASED SWITCHING - FAST
# Faster switching for testing (every 30s)
# ==============================================================================
[Config TimeBasedSwitchingFast]
extends = TimeBasedSwitching
description = "HybridCar: Fast switching (30s interval)"
*.node[*].interfaceManager.switchInterval = 30s


# ==============================================================================
# SCENARIO: TIME-BASED SWITCHING - START SAT
# Start with satellite interface active instead of cellular
# ==============================================================================
[Config TimeBasedSwitchingStartSat]
extends = TimeBasedSwitching
description = "HybridCar: Start with Satellite active"
*.node[*].interfaceManager.startWithSatellite = true

