# ===============================================================================
# Server App Configuration
# ==============================================================================
*.server.numApps = 2
# App 0: Data Sink for background traffic
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000
# App 1: Echo Server for RTT probes
*.server.app[1].typename = "UdpEchoApp"
*.server.app[1].localPort = 7000
*.server.app[1].replyMessageLength = 1024B # Simulate command response size
# ==============================================================================
# Vehicle App Configuration
# ==============================================================================
*.node[*].numApps = 2
# App 0: Load Traffic (e.g., video streaming)
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].localPort = 5030
*.node[*].app[0].messageLength = 1024B
*.node[*].app[0].sendInterval = exponential(500ms) #100ms
*.node[*].app[0].startTime = 5s + ancestorIndex(0) * 2s
*.node[*].app[0].packetName = "BackgroundLoad"
# App 1: Safety Probe
*.node[*].app[1].typename = "UdpBasicApp"
*.node[*].app[1].destAddresses = "server"
*.node[*].app[1].destPort = 7000
*.node[*].app[1].messageLength = 100B
*.node[*].app[1].sendInterval = exponential(1000ms)
*.node[*].app[1].startTime = 2s + ancestorIndex(0) * 0.5s
*.node[*].app[1].packetName = "RTT_Probe"