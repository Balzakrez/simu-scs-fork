# ==============================================================================
# Configuration: HYBRID SWITCHING - QoS BASED
# HybridCar using both interfaces with QoS-based switching strategy
# ==============================================================================

[Config QoSBasedBaseline]
description = "QoS-based switching"

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
# Enable BOTH interfaces: satellite (wlan0) + cellular
*.node[*].numWlanInterfaces = 1
*.node[*].hasCellular = true

# Tell IPv4 configurator about both interfaces
*.node[*].ipv4.configurator.interfaces = "wlan0 cellular"

# Enable HybridInterfaceManager
*.node[*].enableSwitching = true

# ==============================================================================
# HYBRID INTERFACE MANAGER CONFIGURATION
# ==============================================================================
# Switching Mode & Interface Names
*.node[*].interfaceManager.switchingMode = "qos-based"
*.node[*].interfaceManager.satInterfaceName = "wlan0"
*.node[*].interfaceManager.cellInterfaceName = "cellular"
*.node[*].interfaceManager.startWithSatellite = false # Start with Cellular

# QoS Thresholds
*.node[*].interfaceManager.maxAcceptableRTT = 0.2s # 200ms
*.node[*].interfaceManager.minAcceptablePDR = 0.90
*.node[*].interfaceManager.maxAcceptableJitter = 0.5s # 500ms

# Minimum acceptable QoS score to stay on current interface
*.node[*].interfaceManager.minQosScore = 0.70 

# Qos Weights (sum ≈ 1.0)
*.node[*].interfaceManager.weightRTT = 0.33
*.node[*].interfaceManager.weightPDR = 0.33
*.node[*].interfaceManager.weightJitter = 0.33

# Monitoring Intervals
*.node[*].interfaceManager.qosCheckInterval = 2s
*.node[*].interfaceManager.qosCutOffInterval = 10s
*.node[*].interfaceManager.minHoldTime = 10s

# Degradation Count before Switching
*.node[*].interfaceManager.minDegradationCount = 3
# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("../config_networks/netconfig_hybrid.xml")
*.configurator.updateInterval = 1s # Enable frequent updates to react to interface state changes

# Dump for debugging
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dumps/dump_hybrid_qos.xml"
# *.configurator.dumpIpPools = true

# ==============================================================================
# UPDATE INTERVALS
# ==============================================================================
*.manager.updateInterval = 0.2s        # Veins Manager (vehicle) mobility update
*.satellite[*].mobility.updateInterval = 1s    # Satellite mobility update
*.MCC[*].mobility.updateInterval = 200s        # MCC mobility update
**.updateInterval = 0.1s                       # General mobility update

# ==============================================================================
# APPLICATION CONFIGURATION - UDP
# ==============================================================================

include config_app.ini

# ==============================================================================
# Variant: Latency Sensitive
# Se la latenza sale (anche se sotto 0.2s), il punteggio crolla drasticamente
# perché il peso dell'RTT è enorme.
# ==============================================================================
[Config QoSBasedLatencySensitive]
extends = QoSBasedBaseline
description = "Same Thresholds, High RTT Weight"

*.node[*].interfaceManager.weightRTT = 0.8
*.node[*].interfaceManager.weightPDR = 0.1
*.node[*].interfaceManager.weightJitter = 0.1

*.node[*].interfaceManager.minQosScore = 0.70 # Minimum acceptable QoS score to stay on current interface

# ==============================================================================
# Variant: Reliability Focused
# Anche se il delay è buono, se perdo pacchetti il punteggio crolla.
# ==============================================================================
[Config QoSBasedReliabilityFocused]
extends = QoSBasedBaseline
description = "Same Thresholds, High PDR Weight"

*.node[*].interfaceManager.weightRTT = 0.1
*.node[*].interfaceManager.weightPDR = 0.8
*.node[*].interfaceManager.weightJitter = 0.1

*.node[*].interfaceManager.minQosScore = 0.70 # Minimum acceptable QoS score to stay on current interface

# ==============================================================================
# Variant: Aggressive
# Aggressive significa "non tollero difetti".
# Cambiamo ANCHE le soglie e riduciamo l'isteresi.
# ==============================================================================
[Config QoSBasedAggressive]
extends = QoSBasedBaseline
description = "TIGHT Thresholds + Low Hysteresis"

*.node[*].interfaceManager.minDegradationCount = 1

*.node[*].interfaceManager.minQosScore = 0.70 # Minimum acceptable QoS score to stay on current interface