# ==============================================================================
# Configuration: SATELLITE ONLY
# HybridCar using only satellite network (Cellular disabled)
# ==============================================================================
[Config SatelliteOnlyBaseline]
description = "HybridCar: Satellite Only - Baseline (Ping)"

# ==============================================================================
# VEINS MANAGER
# ==============================================================================
*.manager.moduleType = "SatelliteVehicleHybridSample.HybridSCSV5GFusion.HybridCarV2X"
*.manager.updateInterval = 0.2s

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
# Enable satellite, disable cellular
*.node[*].numWlanInterfaces = 1
*.node[*].hasCellular = false # Disable cellular, use only satellite
*.node[*].ipv4.configurator.interfaces = "wlan0"

# Disable HybridInterfaceManager
*.node[*].enableSwitching = false

# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("../config_networks/netconfig_satellite.xml")
*.configurator.updateInterval = 1s

# Dump for debugging
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dumps/dump_sat.xml"

# ==============================================================================
# UPDATE INTERVALS
# ==============================================================================
*.satellite[*].mobility.updateInterval = 1s    # Satellite (satellites move fast)
*.MCC[*].mobility.updateInterval = 200s        # MCC (static ground stations)
**.updateInterval = 0.1s                       # General mobility update

# ==============================================================================
# APPLICATION CONFIGURATION - PING
# ==============================================================================
# Server Application
*.server.numApps = 1
*.server.app[0].typename = "PingApp"
*.server.app[0].destAddr = ""

# Node Application - Staggered ping to avoid collisions
*.node[*].numApps = 1
*.node[*].app[0].typename = "PingApp"
*.node[*].app[0].destAddr = "server"
*.node[*].app[0].sendInterval = exponential(1000ms)
*.node[*].app[0].startTime = 2s + ancestorIndex(0) * 0.5s
*.node[*].app[0].stopTime = ${simTimeLimit}s

# ==============================================================================
# Variant: SatelliteOnlyWithTraffic (Ping + UDP)
# ==============================================================================
[Config SatelliteOnlyWithTraffic]
extends = SatelliteOnlyBaseline

*.server.numApps = 2
*.server.app[0].typename = "UdpEchoApp"
*.server.app[0].localPort = 5000
*.server.app[1].typename = "PingApp"
*.server.app[1].destAddr = ""

*.node[*].numApps = 2
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].localPort = 5030
*.node[*].app[0].messageLength = 1024B
*.node[*].app[0].sendInterval = exponential(100ms)
*.node[*].app[0].startTime = 5s + ancestorIndex(0) * 2s
*.node[*].app[0].stopTime = ${simTimeLimit}s

*.node[*].app[1].typename = "PingApp"
*.node[*].app[1].destAddr = "server"
*.node[*].app[1].sendInterval = exponential(1000ms)
*.node[*].app[1].startTime = 2s + ancestorIndex(0) * 0.5s
*.node[*].app[1].stopTime = ${simTimeLimit}s




