# ==============================================================================
# Configuration: CELLULAR ONLY
# HybridCar using only cellular network (Satellite disabled)
# ==============================================================================

[Config CellularOnlyBaseline]
description = "HybridCar: Cellular Only - Baseline (Don't run this)"

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
# Enable cellular, disable satellite
*.node[*].hasCellular = true
*.node[*].numWlanInterfaces = 0 # Disable satellite interface
*.node[*].ipv4.configurator.interfaces = "cellular"

# Disable HybridInterfaceManager
*.node[*].enableSwitching = false

# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("../config_networks/netconfig_cellular.xml")
*.configurator.updateInterval = 1s

# Dump for debugging
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dumps/dump_cellular.xml"

# ==============================================================================
# UPDATE INTERVALS
# ==============================================================================
*.manager.updateInterval = 0.2s                # Veins Manager
*.satellite[*].mobility.updateInterval = 1s    # Satellite mobility update
*.MCC[*].mobility.updateInterval = 200s        # MCC mobility update
**.updateInterval = 0.1s                       # General mobility update

# ==============================================================================
# CellularOnlyWithTraffic (UDP Echo + UDP Basic)
# ==============================================================================
[Config CellularOnlyWithTraffic]
extends = CellularOnlyBaseline
description = "HybridCar: Cellular Only with Traffic"

include config_app.ini