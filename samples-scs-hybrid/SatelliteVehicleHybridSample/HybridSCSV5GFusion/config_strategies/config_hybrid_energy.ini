# ==============================================================================
# Configuration: HYBRID SWITCHING - ENERGY BASED
# HybridCar using both interfaces with energy-based switching strategy
# ==============================================================================

[Config EnergyBasedStrategy]
description = "HybridCar: Energy-based switching (Battery-driven interface selection)"

# ==============================================================================
# VEINS MANAGER
# ==============================================================================
*.manager.moduleType = "SatelliteVehicleHybridSample.HybridSCSV5GFusion.HybridCarV2X"

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
# Enable BOTH interfaces: satellite (wlan0) + cellular
*.node[*].numWlanInterfaces = 1
*.node[*].hasCellular = true

# Tell IPv4 configurator about both interfaces
*.node[*].ipv4.configurator.interfaces = "wlan0 cellular"

# Enable HybridInterfaceManager
*.node[*].enableSwitching = true

# ==============================================================================
# HYBRID INTERFACE MANAGER CONFIGURATION
# ==============================================================================
# Switching mode: "energy-aware"
*.node[*].interfaceManager.switchingMode = "energy-based"

# Interface names
*.node[*].interfaceManager.satInterfaceName = "wlan0"
*.node[*].interfaceManager.cellInterfaceName = "cellular"

# Starting interface: true = start with Satellite (high energy available)
*.node[*].interfaceManager.startWithSatellite = true

# Energy-Aware Strategy Parameters (in HybridInterfaceManager.ned)
# ---------------------------------
# Enable energy status monitoring (disabiled by default)
*.node[*].hasStatus = true

# Energy thresholds for switching decisions
*.node[*].interfaceManager.criticalEnergyThreshold = 30J   # 10% battery → FORCE cellular
*.node[*].interfaceManager.lowEnergyThreshold = 90J        # 30% battery → PREFER cellular
*.node[*].interfaceManager.highEnergyThreshold = 240J      # 80% battery → CAN USE satellite

# Check energy level every 5 seconds
*.node[*].interfaceManager.energyCheckInterval = 5s

# ==============================================================================
# ENERGY STORAGE (Battery)
# ==============================================================================
*.node[*].energyStorage.typename = "SimpleEpEnergyStorage"
*.node[*].energyStorage.nominalCapacity = 300J      # 300 Joule battery capacity
*.node[*].energyStorage.initialCapacity = 300J      # Start with full battery
*.node[*].energyStorage.printCapacityStep = 30J     # Log every 10% consumption

# ==============================================================================
# ENERGY MANAGEMENT
# ==============================================================================
*.node[*].energyManagement.typename = "SimpleEpEnergyManagement"
*.node[*].energyManagement.nodeShutdownCapacity = 0J    # Shutdown when battery = 0
*.node[*].energyManagement.nodeStartCapacity = 10J      # Restart when charge > 10J

# ==============================================================================
# SATELLITE INTERFACE ENERGY CONSUMPTION (wlan[0])
# High power consumption due to 10W transmission power
# ==============================================================================
*.node[*].wlan[0].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"

# Transmitter states (UPLINK: Vehicle → Satellite)
*.node[*].wlan[0].radio.energyConsumer.transmitterIdlePowerConsumption = 10mW
*.node[*].wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 10W  # HIGH!
*.node[*].wlan[0].radio.energyConsumer.transmitterReceivingPowerConsumption = 5mW

# Receiver states (DOWNLINK: Satellite → Vehicle)
*.node[*].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 10mW
*.node[*].wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 100mW
*.node[*].wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 50mW

# ==============================================================================
# CELLULAR INTERFACE ENERGY CONSUMPTION (cellularNic)
# Lower power consumption (more energy-efficient)
# ==============================================================================
*.node[*].cellularNic.phy.energyConsumer.typename = "StateBasedEpEnergyConsumer"

# Transmitter states (UPLINK: Vehicle → eNodeB)
*.node[*].cellularNic.phy.energyConsumer.transmitterIdlePowerConsumption = 5mW
*.node[*].cellularNic.phy.energyConsumer.transmitterTransmittingPowerConsumption = 200mW  # MUCH LOWER!
*.node[*].cellularNic.phy.energyConsumer.transmitterReceivingPowerConsumption = 2mW

# Receiver states (DOWNLINK: eNodeB → Vehicle)
*.node[*].cellularNic.phy.energyConsumer.receiverIdlePowerConsumption = 5mW
*.node[*].cellularNic.phy.energyConsumer.receiverReceivingPowerConsumption = 50mW
*.node[*].cellularNic.phy.energyConsumer.receiverBusyPowerConsumption = 20mW

# ==============================================================================
# SIMU5G CELLULAR PARAMETERS
# ==============================================================================
*.node[*].nodeType = "UE"
*.node[*].masterId = 1
*.node[*].macCellId = 1
*.node[*].macNodeId = ancestorIndex(0)

# ==============================================================================
# SATELLITE CONFIGURATION
# ==============================================================================
*.satellite[*].forwarding = true
*.satellite[*].ipv4.forwarding = true

# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("../config_networks/netconfig_hybrid.xml")

# Enable frequent updates to react to interface state changes
*.configurator.updateInterval = 1s

# Dump for debugging
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dumps/dump_hybrid_energy.xml"

# ==============================================================================
# UPDATE INTERVALS
# ==============================================================================
# Veins Manager (vehicle) mobility update interval
*.manager.updateInterval = 0.2s

# Satellite and MCC mobility update interval
*.satellite[*].mobility.updateInterval = 1s
*.MCC[*].mobility.updateInterval = 200s

# General Mobility Update
**.updateInterval = 0.1s

# ==============================================================================
# APPLICATION CONFIGURATION - UDP
# ==============================================================================
# Server
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

# Nodes - Continuous traffic to observe energy consumption and switching
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].localPort = 5030
*.node[*].app[0].messageLength = 8192B  # 8 KB packets

# Traffic pattern to observe energy drainage
*.node[*].app[0].sendInterval = exponential(500ms)  # Burst pattern with mean 500ms
*.node[*].app[0].startTime = 5s + ancestorIndex(0) * 2s  # Staggered start (2s offset per vehicle)
*.node[*].app[0].stopTime = ${simTimeLimit}s


# ==============================================================================
# SCENARIO: ENERGY AWARE - LOW BATTERY START
# Start with low battery to quickly observe cellular-only operation
# ==============================================================================
[Config EnergyBasedLowBattery]
extends = EnergyBasedStrategy
description = "HybridCar: Start with low battery (20% capacity)"

# Start with 20% battery (60J out of 300J)
*.node[*].energyStorage.initialCapacity = 60J

# Start with cellular (since battery is low)
*.node[*].interfaceManager.startWithSatellite = false


# ==============================================================================
# SCENARIO: ENERGY BASED - CRITICAL BATTERY
# Start with very low battery to observe emergency cellular-only mode
# ==============================================================================
[Config EnergyBasedCriticalBattery]
extends = EnergyBasedStrategy
description = "HybridCar: Start with critical battery (5% capacity)"

# Start with 5% battery (15J out of 300J)
*.node[*].energyStorage.initialCapacity = 15J

# Start with cellular (forced due to critical energy)
*.node[*].interfaceManager.startWithSatellite = false

# ==============================================================================
# SCENARIO: ENERGY BASED - AGGRESSIVE DRAINAGE
# High traffic load to accelerate battery drainage for testing
# ==============================================================================
[Config EnergyBasedAggressiveDrainage]
extends = EnergyBasedStrategy
description = "HybridCar: Aggressive traffic to accelerate battery drainage"

# Start with 32% battery (92J out of 300J) to observe switching (TESTING PURPOSES)
*.node[*].energyStorage.initialCapacity = 92J # Comment if not a testing scenario

# Allow long transmissions for high-traffic scenarios
**.radioMediumSV[*].maxTransmissionDuration = 10s  

# Set dimensions of the queue to avoid packet drops under high load (default is -1 = infinite)
# *.node[*].wlan[0].mac.queue.packetCapacity = 100

# More aggressive traffic pattern
# *.node[*].app[0].sendInterval = exponential(100ms)  # Much higher frequency
# *.node[*].app[0].messageLength = 32768B  # Larger packets (32 KB)
# *.node[*].app[0].messageLength = 16384B  # Ridotto da 32KB a 16KB

*.node[*].app[0].sendInterval = exponential(200ms)  # Reduced da 100ms a 200ms
# *.node[*].app[0].messageLength = 8192B # Ridotto da 32KB a 8KB
*.node[*].app[0].messageLength = 12288B # Ridotto da 32KB a 12KB

# Shorter energy check interval to see more frequent switches
*.node[*].interfaceManager.energyCheckInterval = 1s