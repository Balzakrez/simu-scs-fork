# ==============================================================================
# Configuration: HYBRID SWITCHING - COVERAGE BASED
# HybridCar using both interfaces with elevation-based switching strategy
# ==============================================================================

[Config CoverageBasedSwitching]
description = "HybridCar: Coverage-based switching (Satellite preferred when Elevation > 15deg)"

# ==============================================================================
# VEINS MANAGER
# ==============================================================================
*.manager.moduleType = "SatelliteVehicleHybridSample.HybridSCSV5GFusion.HybridCarV2X"

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
# Enable BOTH interfaces: satellite (wlan0) + cellular
*.node[*].numWlanInterfaces = 1
*.node[*].hasCellular = true

# Tell IPv4 configurator about both interfaces
*.node[*].ipv4.configurator.interfaces = "wlan0 cellular"

# Enable HybridInterfaceManager
*.node[*].enableSwitching = true

# ==============================================================================
# HYBRID INTERFACE MANAGER CONFIGURATION
# ==============================================================================
# Switching mode : "coverage-based"
*.node[*].interfaceManager.switchingMode = "coverage-based"

# Interface names
*.node[*].interfaceManager.satInterfaceName = "wlan0"
*.node[*].interfaceManager.cellInterfaceName = "cellular"

# Path to the satellite module (verified from top-level config)
*.node[*].interfaceManager.satelliteModulePath = "satellite[0]"

# Starting interface: false = start with Cellular (wait for satellite acquisition)
*.node[*].interfaceManager.startWithSatellite = true

# Coverage Strategy Parameters (in HybridInterfaceManager.ned)
# ----------------------------
# Check geometry every 1 second
*.node[*].interfaceManager.coverageCheckInterval = 1s


# ==============================================================================
# SIMU5G CELLULAR PARAMETERS
# ==============================================================================
*.node[*].nodeType = "UE"
*.node[*].masterId = 1      # eNodeB ID
*.node[*].macCellId = 1     # LTE cell ID
*.node[*].macNodeId = ancestorIndex(0)

# ==============================================================================
# SATELLITE CONFIGURATION
# ==============================================================================
*.satellite[*].forwarding = true  
*.satellite[*].ipv4.forwarding = true

# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("../config_networks/netconfig_hybrid.xml")

# Enable frequent updates to react to interface state changes and route recalculations
*.configurator.updateInterval = 1s

# Dump for debugging
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dumps/dump_hybrid_coverage.xml" # Output dump file

# ==============================================================================
# UPDATE INTERVALS
# ==============================================================================
# Veins Manager (vehicle) mobility update interval
*.manager.updateInterval = 0.2s

# Satellite and MCC mobility update interval
# Crucial: Satellite needs frequent updates to calculate elevation correctly
*.satellite[*].mobility.updateInterval = 1s
*.MCC[*].mobility.updateInterval = 200s

# General Mobility Update
**.updateInterval = 0.1s

# ==============================================================================
# APPLICATION CONFIGURATION - UDP
# ==============================================================================
# Server
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

# Nodes - Continuous traffic to observe switching behavior
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].localPort = 5030
*.node[*].app[0].messageLength = 8192B # 8 KB packets

# This cause high collision probability on shared medium
# *.node[*].app[0].sendInterval = 0.1s  # High frequency to detect exact switch moment (may cause collisions)

# Note: Important for avoid collisions during communication
# *.node[*].app[0].sendInterval = uniform(0.5s, 1.5s)  # Uniform traffic from 0.5s to 1.5s
# *.node[*].app[0].startTime = uniform(5s, 10s)  # Random start

*.node[*].app[0].sendInterval = exponential(500ms)  # Burst pattern with mean 500ms
*.node[*].app[0].startTime =  5s + ancestorIndex(0) * 2s  # 2s offset per vehicle (Staggered start)

*.node[*].app[0].stopTime = ${simTimeLimit}s


