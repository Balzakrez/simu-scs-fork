# ==============================================================================
# Configuration: HYBRID SWITCHING - COVERAGE BASED
# HybridCar using both interfaces with elevation-based switching strategy
# ==============================================================================

[Config CoverageBasedBaseline]
description = "HybridCar: Coverage-based switching (Satellite First)"

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
# Enable BOTH interfaces: satellite (wlan0) + cellular
*.node[*].numWlanInterfaces = 1
*.node[*].hasCellular = true
*.node[*].ipv4.configurator.interfaces = "wlan0 cellular"

# Enable HybridInterfaceManager
*.node[*].enableSwitching = true

# ==============================================================================
# HYBRID INTERFACE MANAGER CONFIGURATION
# ==============================================================================
# Switching Mode & Interface Names
*.node[*].interfaceManager.switchingMode = "coverage-based"
*.node[*].interfaceManager.satInterfaceName = "wlan0"
*.node[*].interfaceManager.cellInterfaceName = "cellular"
*.node[*].interfaceManager.startWithSatellite = true # Start with satellite (wait for acquisition)

# Coverage Strategy Parameters
*.node[*].interfaceManager.coverageCheckInterval = 1s # Check geometry every 1 second
# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("../config_networks/netconfig_hybrid.xml")
*.configurator.updateInterval = 1s # Enable frequent updates for route recalculations

# Dump for debugging
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dumps/dump_hybrid_coverage.xml"

# ==============================================================================
# UPDATE INTERVALS
# ==============================================================================
*.manager.updateInterval = 0.2s                # Veins Manager
*.satellite[*].mobility.updateInterval = 1s    # Satellite (frequent updates for elevation calculation)
*.MCC[*].mobility.updateInterval = 200s        # MCC
**.updateInterval = 0.1s                       # General


# ==============================================================================
# Variant: CoverageBasedWithTraffic (Ping + UDP)
# ==============================================================================
[Config CoverageBasedWithTraffic]
extends = CoverageBasedBaseline
description = "HybridCar: Coverage-based switching with Traffic"

include config_app.ini