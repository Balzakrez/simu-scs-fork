# ==============================================================================
# Configuration: HYBRID SWITCHING - ENERGY AWARE
# HybridCar using both interfaces with Energy-Aware switching strategy
# ==============================================================================

[Config EnergyAwareBaseline]
description = "Energy-aware switching (Don't run this)"

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
*.node[*].numWlanInterfaces = 1
*.node[*].hasCellular = true
*.node[*].ipv4.configurator.interfaces = "wlan0 cellular"
*.node[*].enableSwitching = true

# ==============================================================================
# HYBRID INTERFACE MANAGER CONFIGURATION
# ==============================================================================
# Switching Mode & Interface Names
*.node[*].interfaceManager.switchingMode = "energy-aware"
*.node[*].interfaceManager.satInterfaceName = "wlan0"
*.node[*].interfaceManager.cellInterfaceName = "cellular"
*.node[*].interfaceManager.startWithSatellite = false

# Energy Thresholds
*.node[*].interfaceManager.criticalEnergyThreshold = 30J # 10% of 300J

# QoS Thresholds
*.node[*].interfaceManager.maxAcceptableRTT = 0.2s # 200ms
*.node[*].interfaceManager.minAcceptablePDR = 0.90 # 90%
*.node[*].interfaceManager.maxAcceptableJitter = 0.5s # 500ms

# Qos Weights (sum ≈ 1.0)
*.node[*].interfaceManager.weightRTT = 0.33
*.node[*].interfaceManager.weightPDR = 0.33
*.node[*].interfaceManager.weightJitter = 0.33

# Utility Function - BALANCED (50-50)
*.node[*].interfaceManager.weightQos = 0.5
*.node[*].interfaceManager.weightEnergy = 0.5

# Minimum acceptable utility score to stay on current interface
*.node[*].interfaceManager.minUtilityScore = 0.70 

# Energy Cost Model
*.node[*].interfaceManager.satelliteEnergyCostPerByte = 0.001J # 5x
*.node[*].interfaceManager.cellularEnergyCostPerByte = 0.0002J

# Timing Parameters
*.node[*].interfaceManager.energyCheckInterval = 2s
*.node[*].interfaceManager.energyCutOffInterval = 10s
*.node[*].interfaceManager.minHoldTime = 10s

# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("../config_networks/netconfig_hybrid.xml")
*.configurator.updateInterval = 1s

# Dump for debugging
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dumps/dump_hybrid_energy.xml"

# ==============================================================================
# UPDATE INTERVALS
# ==============================================================================
*.manager.updateInterval = 0.2s                # Veins Manager
*.satellite[*].mobility.updateInterval = 1s    # Satellite
*.MCC[*].mobility.updateInterval = 200s        # MCC
**.updateInterval = 0.1s                       # General

# ==============================================================================
# SATELLITE INTERFACE ENERGY CONSUMPTION (wlan[0])
# High power consumption due to 10W transmission power
# ==============================================================================
*.node[*].wlan[0].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"

# Transmitter states (UPLINK: Vehicle -> Satellite)
*.node[*].wlan[0].radio.energyConsumer.transmitterIdlePowerConsumption = 10mW
*.node[*].wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 10W  # HIGH!
*.node[*].wlan[0].radio.energyConsumer.transmitterReceivingPowerConsumption = 5mW

# Receiver states (DOWNLINK: Satellite -> Vehicle)
*.node[*].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 10mW
*.node[*].wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 100mW
*.node[*].wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 50mW

# ==============================================================================
# CELLULAR INTERFACE ENERGY CONSUMPTION (cellularNic)
# Lower power consumption (more energy-efficient)
# ==============================================================================
*.node[*].cellularNic.phy.energyConsumer.typename = "StateBasedEpEnergyConsumer"

# Transmitter states (UPLINK: Vehicle -> eNodeB)
*.node[*].cellularNic.phy.energyConsumer.transmitterIdlePowerConsumption = 5mW
*.node[*].cellularNic.phy.energyConsumer.transmitterTransmittingPowerConsumption = 200mW  # MUCH LOWER!
*.node[*].cellularNic.phy.energyConsumer.transmitterReceivingPowerConsumption = 2mW

# Receiver states (DOWNLINK: eNodeB -> Vehicle)
*.node[*].cellularNic.phy.energyConsumer.receiverIdlePowerConsumption = 5mW
*.node[*].cellularNic.phy.energyConsumer.receiverReceivingPowerConsumption = 50mW
*.node[*].cellularNic.phy.energyConsumer.receiverBusyPowerConsumption = 20mW


# ==============================================================================
# APPLICATION CONFIGURATION - PING ONLY
# ==============================================================================

include config_app.ini

# ==============================================================================
# Variant 1: PURE ENERGY (100% focus energy)
# ==============================================================================
[Config EnergyAware_100E_00Q]
extends = EnergyAwareBaseline
description = "Pure energy optimization (100 energy - 0 QoS)"

*.node[*].interfaceManager.weightEnergy = 1.0
*.node[*].interfaceManager.weightQos = 0.0

# Minimum acceptable utility score to stay on current interface
*.node[*].interfaceManager.minUtilityScore = 0.7 

# ==============================================================================
# Variant 2: ENERGY DOMINANT (90-10)
# ==============================================================================
[Config EnergyAware_90E_10Q]
extends = EnergyAwareBaseline
description = "Energy dominant (90 energy - 10 QoS)"

*.node[*].interfaceManager.weightEnergy = 0.9
*.node[*].interfaceManager.weightQos = 0.1

# Minimum acceptable utility score to stay on current interface
*.node[*].interfaceManager.minUtilityScore = 0.7 

# ==============================================================================
# Variant 3: ENERGY FOCUSED (80-20)
# ==============================================================================
[Config EnergyAware_80E_20Q]
extends = EnergyAwareBaseline
description = "Energy focused (80 energy - 20 QoS)"

*.node[*].interfaceManager.weightEnergy = 0.8
*.node[*].interfaceManager.weightQos = 0.2

# satEnrgyEfficiency = minCost / satCostPerByte = cellEnergyCost / 0.001 = 0.2
# Max satelliteUtiliyScore: (weightEnergy * satEnergyEfficiency) + (weightQos * maxQoSScore) 
# = (0.8 * 0.2) + (0.2 * 1.0) = 0.16 + 0.2 = 0.36
# Max cellularUtilityScore: (weightEnergy * cellEnergyEfficiency) + (weightQos * maxQoSScore)
# = (0.8 * 1.0) + (0.2 * 1.0) = 0.8 + 0.2 = 1.0

# Decrement minUtilityScore to ensure satellite can be selected
*.node[*].interfaceManager.minUtilityScore = 0.30

# ==============================================================================
# Variant 4: ENERGY PRIORITY (70-30)
# ==============================================================================
[Config EnergyAware_70E_30Q]
extends = EnergyAwareBaseline
