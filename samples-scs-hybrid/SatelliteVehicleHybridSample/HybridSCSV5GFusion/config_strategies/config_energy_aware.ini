# ==============================================================================
# Configuration: HYBRID SWITCHING - ENERGY AWARE
# HybridCar using both interfaces with Energy-Aware switching strategy
# ==============================================================================

[Config EnergyAwareBaseline]
description = "HybridCar: Energy-aware switching (balances energy cost and QoS)"

# ==============================================================================
# VEINS MANAGER
# ==============================================================================
*.manager.moduleType = "SatelliteVehicleHybridSample.HybridSCSV5GFusion.HybridCarV2X"

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
*.node[*].numWlanInterfaces = 1
*.node[*].hasCellular = true
*.node[*].ipv4.configurator.interfaces = "wlan0 cellular"
*.node[*].enableSwitching = true

# ==============================================================================
# HYBRID INTERFACE MANAGER CONFIGURATION
# ==============================================================================
# Switching Mode & Interface Names
*.node[*].interfaceManager.switchingMode = "energy-aware"
*.node[*].interfaceManager.satInterfaceName = "wlan0"
*.node[*].interfaceManager.cellInterfaceName = "cellular"
*.node[*].interfaceManager.startWithSatellite = false

*.node[*].interfaceManager.satelliteModulePath = "satellite[0]"

# Enable energy status monitoring (disabiled by default)
*.node[*].hasStatus = true

# Optimization Mode: "minimize_energy", "maximize_qos", "balanced"
*.node[*].interfaceManager.optimizationMode = "balanced"

# Energy Thresholds
*.node[*].interfaceManager.criticalEnergyThreshold = 30J
*.node[*].interfaceManager.lowEnergyThreshold = 90J

# QoS Thresholds (for QoS scoring)
*.node[*].interfaceManager.maxAcceptableRTT = 0.5s
*.node[*].interfaceManager.minAcceptablePDR = 0.85

# Energy Cost Model (derived from real power consumption)
*.node[*].interfaceManager.satelliteEnergyCostPerByte = 0.01J   # High cost (10W transmission)
*.node[*].interfaceManager.cellularEnergyCostPerByte = 0.0002J  # Low cost (200mW transmission)

# Timing Parameters
*.node[*].interfaceManager.energyCheckInterval = 5s
*.node[*].interfaceManager.minHoldTime = 10s


# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("../config_networks/netconfig_hybrid.xml")
*.configurator.updateInterval = 1s

# Dump for debugging
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dumps/dump_hybrid_energy.xml"

# ==============================================================================
# UPDATE INTERVALS
# ==============================================================================
*.manager.updateInterval = 0.2s                # Veins Manager
*.satellite[*].mobility.updateInterval = 1s    # Satellite
*.MCC[*].mobility.updateInterval = 200s        # MCC
**.updateInterval = 0.1s                       # General


# ==============================================================================
# ENERGY STORAGE (Battery)
# ==============================================================================
*.node[*].energyStorage.typename = "SimpleEpEnergyStorage"
*.node[*].energyStorage.nominalCapacity = 300J
*.node[*].energyStorage.initialCapacity = 300J
*.node[*].energyStorage.printCapacityStep = 30J

# ==============================================================================
# ENERGY MANAGEMENT
# ==============================================================================
*.node[*].energyManagement.typename = "SimpleEpEnergyManagement"
*.node[*].energyManagement.nodeShutdownCapacity = 0J
*.node[*].energyManagement.nodeStartCapacity = 10J

# ==============================================================================
# SATELLITE INTERFACE ENERGY CONSUMPTION (wlan[0])
# High power consumption due to 10W transmission power
# ==============================================================================
*.node[*].wlan[0].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"

# Transmitter states (UPLINK: Vehicle → Satellite)
*.node[*].wlan[0].radio.energyConsumer.transmitterIdlePowerConsumption = 10mW
*.node[*].wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 10W  # HIGH!
*.node[*].wlan[0].radio.energyConsumer.transmitterReceivingPowerConsumption = 5mW

# Receiver states (DOWNLINK: Satellite → Vehicle)
*.node[*].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 10mW
*.node[*].wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 100mW
*.node[*].wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 50mW

# ==============================================================================
# CELLULAR INTERFACE ENERGY CONSUMPTION (cellularNic)
# Lower power consumption (more energy-efficient)
# ==============================================================================
*.node[*].cellularNic.phy.energyConsumer.typename = "StateBasedEpEnergyConsumer"

# Transmitter states (UPLINK: Vehicle → eNodeB)
*.node[*].cellularNic.phy.energyConsumer.transmitterIdlePowerConsumption = 5mW
*.node[*].cellularNic.phy.energyConsumer.transmitterTransmittingPowerConsumption = 200mW  # MUCH LOWER!
*.node[*].cellularNic.phy.energyConsumer.transmitterReceivingPowerConsumption = 2mW

# Receiver states (DOWNLINK: eNodeB → Vehicle)
*.node[*].cellularNic.phy.energyConsumer.receiverIdlePowerConsumption = 5mW
*.node[*].cellularNic.phy.energyConsumer.receiverReceivingPowerConsumption = 50mW
*.node[*].cellularNic.phy.energyConsumer.receiverBusyPowerConsumption = 20mW


# ==============================================================================
# APPLICATION CONFIGURATION - PING ONLY
# ==============================================================================
# Server Application
*.server.numApps = 1
*.server.app[0].typename = "PingApp"
*.server.app[0].destAddr = ""  # Reply to pings

# Node Application - Only Ping for RTT/PDR monitoring
*.node[*].numApps = 1
*.node[*].app[0].typename = "PingApp"
*.node[*].app[0].destAddr = "server"
*.node[*].app[0].sendInterval = exponential(1000ms)
*.node[*].app[0].startTime = 2s + ancestorIndex(0) * 0.5s
*.node[*].app[0].stopTime = ${simTimeLimit}s


# ==============================================================================
# Variant: EnergyAwareMinimizeEnergy
# ==============================================================================
[Config EnergyAwareMinimizeEnergy]
extends = EnergyAwareBaseline
description = "Minimize energy consumption - prefer cellular"

*.node[*].interfaceManager.optimizationMode = "minimize_energy"
*.node[*].interfaceManager.minAcceptablePDR = 0.75  # Relax QoS requirements

# ==============================================================================
# Variant: EnergyAwareMaximizeQoS
# ==============================================================================
[Config EnergyAwareMaximizeQoS]
extends = EnergyAwareBaseline
description = "Maximize QoS - prefer satellite when visible and energy permits"

*.node[*].interfaceManager.optimizationMode = "maximize_qos"
*.node[*].interfaceManager.maxAcceptableRTT = 0.2s
*.node[*].interfaceManager.minAcceptablePDR = 0.95

# ==============================================================================
# Variant: EnergyAwareBalanced
# ==============================================================================
[Config EnergyAwareBalanced]
extends = EnergyAwareBaseline
description = "Balanced mode - 40% energy, 60% QoS"

*.node[*].interfaceManager.optimizationMode = "balanced"

# ==============================================================================
# Variant: EnergyAwareLowBattery
# ==============================================================================
[Config EnergyAwareLowBattery]
extends = EnergyAwareBaseline
description = "Low battery scenario - aggressive energy saving"

*.node[*].energyStorage.initialCapacity = 90J  # Start at 30%
*.node[*].interfaceManager.optimizationMode = "minimize_energy"
*.node[*].interfaceManager.criticalEnergyThreshold = 20J
*.node[*].interfaceManager.lowEnergyThreshold = 50J

# ==============================================================================
# Variant: EnergyAwareSwitchingWithTraffic (Ping + UDP)
# ==============================================================================
[Config EnergyAwareSwitchingWithTraffic]
extends = EnergyAwareBaseline
description = "Energy-aware with UDP traffic (not recommended - drains battery faster)"

*.server.numApps = 2
*.server.app[0].typename = "UdpEchoApp"
*.server.app[0].localPort = 5000
*.server.app[1].typename = "PingApp"
*.server.app[1].destAddr = ""

*.node[*].numApps = 2
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].localPort = 5030
*.node[*].app[0].messageLength = 1024B
*.node[*].app[0].sendInterval = exponential(100ms) #! standard is 200ms
*.node[*].app[0].startTime = 5s + ancestorIndex(0) * 2s
*.node[*].app[0].stopTime = ${simTimeLimit}s

*.node[*].app[1].typename = "PingApp"
*.node[*].app[1].destAddr = "server"
*.node[*].app[1].sendInterval = exponential(1000ms)
*.node[*].app[1].startTime = 2s + ancestorIndex(0) * 0.5s
*.node[*].app[1].stopTime = ${simTimeLimit}s