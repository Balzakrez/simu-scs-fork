# ==============================================================================
# GENERAL SIMULATION SETTINGS
# Base configuration common to all scenarios
# ==============================================================================

[General]
# ==============================================================================
# SIMULATION CONTROL
# ==============================================================================
sim-time-limit = ${simTimeLimit=500}s
# warmup-period = 10s
repeat = 1
seed-set = ${repetition}

# ==============================================================================
# NETWORK DEFINITION
# ==============================================================================
network = HybridFusionNet

# ==============================================================================
# RESOURCE PATHS
# ==============================================================================
image-path = "../../images"

# ==============================================================================
# OUTPUT CONFIGURATION
# ==============================================================================
# Output Directories & Files
result-dir = "../results"
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec

# Optional Output Files (Commented)
# record-eventlog = true
# eventlog-file = ${resultdir}/${configname}/${repetition}.elog
# cmdenv-redirect-output = true
# cmdenv-output-file = ${resultdir}/${configname}/${repetition}.log

# ==============================================================================
# DEBUGGING & LOGGING
# ==============================================================================
# Command Environment
cmdenv-express-mode = true

# Global log level (off, fatal, error, warning, info, debug, detail, trace)
# **.cmdenv-log-level = detail

# Module-specific log levels
*.upf.gtp_user.**.cmdenv-log-level = trace
*.gNB.trafficFlowFilter.**.cmdenv-log-level = trace
*.binder.**.cmdenv-log-level = trace

# ==============================================================================
# STATISTICS RECORDING CONFIGURATION
# ==============================================================================
**.vector-recording = true
**.scalar-recording = true

# APPLICATION STATISTICS
# PingApp
**.app[*].rtt.record = vector,stats,histogram
**.app[*].pingTxSeq.record = vector
**.app[*].pingRxSeq.record = vector

# UdpBasicApp / UdpEchoApp
**.app[*].sentPk.record = vector,count
**.app[*].rcvdPk.record = vector,count
**.app[*].rcvdPkLifetime.record = vector,stats,histogram

# DISABLE UNUSED (riduce dimensione output)
**.routingRecorder.enabled = false
**.sctp.**.recording = false
**.tcp.**.recording = false

# ==============================================================================
# COORDINATE SYSTEMS & POSITIONING
# ==============================================================================
# SUMO Integration (Primary Geographic Reference)
*.Pos.sumoNetFile = "../sumodir/minato/mmArea1net.xml"

# Manual Geographic Reference (Fallback if SUMO file fails)
# *.Pos.referenceLatitude = 35.489637   # Center Latitude (degrees)
# *.Pos.referenceLongitude = 139.710834 # Center Longitude (degrees)

# Pixel-based Visualization System (GEO → PIXEL)
*.Pos.mapx = 2160   # World Map width in pixels (same as playgroundSizeX)
*.Pos.mapy = 1080   # World Map height in pixels (same as playgroundSizeY)
*.Pos.offset_x = 1770  # Offset x to extract Map2 from World Map
*.Pos.offset_y = 181   # Offset y to extract Map2 from World Map
*.Pos.mapx2 = 255   # Map2 width in pixels (sub-area of interest)
*.Pos.mapy2 = 255   # Map2 height in pixels (sub-area of interest)
*.Pos.offsetX = 1080   # Graphic offset to translate world map (playgroundSizeX / 2)

# Meter-based Simulation System (Network Calculations)
*.Pos.emapx = 1080  # Emap width in meters for OMNeT++ simulation
*.Pos.emapy = 1080  # Emap height in meters for OMNeT++ simulation

# Playground & Constraint Area
*.playgroundSizeX = 2160m  # Simulation visualization area width
*.playgroundSizeY = 1080m  # Simulation visualization area height
*.playgroundSizeZ = 50m    # Simulation visualization area depth

**.constraintAreaMinX = 0m     # Mobile nodes movement area min X
**.constraintAreaMaxX = 2160m  # Mobile nodes movement area max X
**.constraintAreaMinY = 0m     # Mobile nodes movement area min Y
**.constraintAreaMaxY = 1080m  # Mobile nodes movement area max Y
**.constraintAreaMinZ = 0m     # Mobile nodes movement area min Z
**.constraintAreaMaxZ = 0m     # Mobile nodes movement area max Z

# ==============================================================================
# GLOBAL PARAMETERS
# ==============================================================================

# Mobility (Global Settings)
**.mobility.updateFromDisplayString = false