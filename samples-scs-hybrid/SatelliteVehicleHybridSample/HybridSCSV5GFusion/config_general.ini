# ==============================================================================
# GENERAL SIMULATION SETTINGS
# Base configuration common to all scenarios
# ==============================================================================

[General]
# Simulation Control
sim-time-limit = ${simTimeLimit=180}s
warmup-period = 10s
repeat = 1

# Resource Paths
image-path = ../../images

# Network Definition
network = HybridFusionNet


# ==============================================================================
# OUTPUT & STATISTICS
# ==============================================================================
# Output File Configuration
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec

# Seed Configuration
seed-set = ${repetition}

# Recording Settings
**.vector-recording = true
**.routingRecorder.enabled = false
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false
**.app[0].**.vector-recording = true
**.app[0].**.scalar-recording = true

# ==============================================================================
# DEBUGGING & LOGGING
# ==============================================================================
# Event Log Configuration
# record-eventlog = true
# eventlog-file = ${resultdir}/${configname}/${repetition}.log
# eventlog-file = ${resultdir}/${configname}/${repetition}.elog

# Redirect output to file
# cmdenv-output-file = ${resultdir}/${configname}/${repetition}.log

# Redirect both stdout and stderr to the output file
# cmdenv-redirect-output = true

# Disable express mode for detailed logging
cmdenv-express-mode = true

# Log level globale 
# **.cmdenv-log-level = info

# ==============================================================================
# GLOBAL PARAMETERS
# ==============================================================================
# AMC Module
**.numBands = 50

# Mobility (global)
**.mobility.updateFromDisplayString = false

# eNodeB Positioning
*.eNB.mobility.initFromDisplayString = false
*.eNB.mobility.initialX = 300m
*.eNB.mobility.initialY = 300m

# ==============================================================================
# POSITIONING & COORDINATE SYSTEM CONFIGURATION
# ==============================================================================
# SUMO Integration (Recommended)
*.Pos.sumoNetFile = "../sumodir/mmArea1net.xml"

# Manual Geographic Center (Fallback if SUMO file fails)
# *.Pos.referenceLatitude = 35.489637   # Center Latitude (degrees) of your SUMO map
# *.Pos.referenceLongitude = 139.710834 # Center Longitude (degrees) of your SUMO map

# ==============================================================================
# TOYOTA SYSTEM: GEO -> PIXEL (Visualization)
# ==============================================================================
# World Map dimensions in pixels (main map for visualization)
*.Pos.mapx = 2160 # Same as playgroundSizeX (but in pixels)
*.Pos.mapy = 1080 # Same as playgroundSizeY (but in pixels)

# Offset x/y to extract Map2 from World Map
*.Pos.offset_x = 1770 
*.Pos.offset_y = 181  

# Map2 dimensions in pixels (sub-area of World Map, area of interest)
*.Pos.mapx2 = 255 # pixels
*.Pos.mapy2 = 255 # pixels

# Graphic offset to translate world map to the right of SUMO/Veins map
*.Pos.offsetX = 1080 # playgroundSizeX / 2 

# ==============================================================================
# METERS <-> GEO SYSTEM (Network Calculations)
# ==============================================================================
# Emap (Effective Map) dimensions in meters for OMNeT++ simulation
*.Pos.emapx = 1080 # meters
*.Pos.emapy = 1080 # meters

# ==============================================================================
# PLAYGROUND & CONSTRAINT AREA
# ==============================================================================
# Constraint Area: Defines the area where mobile nodes can move
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 2160m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1080m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 0m

# Playground Size: Defines simulation visualization area dimensions
*.playgroundSizeX = 2160m
*.playgroundSizeY = 1080m
*.playgroundSizeZ = 50m