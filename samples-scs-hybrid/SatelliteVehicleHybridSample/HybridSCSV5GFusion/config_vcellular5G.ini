# ==============================================================================
# SIMU5G CELLULAR PARAMETERS
# Default settings for UE (vehicle) configurations
# Same parameters are leagacy compatible with 4G/LTE configurations
# ==============================================================================

[General]
# ==============================================================================
# 5G NR UE (Vehicle) CONFIGURATION
# ==============================================================================
# --- Hybrid Vehicle Parameters ---
# *.node[*].hasCellular = true              # Enable cellular interface
# *.node[*].enableSwitching = true          # Enable HybridInterfaceManager

# --- Cell Association ---
*.node[*].nodeType = "UE"
*.node[*].nrMasterId = 1
*.node[*].nrMacCellId = 1
*.node[*].nrMacNodeId = ancestorIndex(0)

# Legacy 4G/LTE parameters (per backward compatibility with simuLTE) 
*.node[*].masterId = 1            
*.node[*].macCellId = 1          
*.node[*].macNodeId = ancestorIndex(0)

# --- Physical Layer (must be the same as gNodeB) ---
*.node[*].cellularNic.nrPhy.numerologyIndex = 0 # (same as gNB)
*.node[*].cellularNic.nrPhy.carrierFrequency = 2GHz # (same as gNB)
*.node[*].cellularNic.nrPhy.bandwidth = 100MHz # (same as gNB)
*.node[*].cellularNic.nrPhy.txPower = 23dBm # UE Tx Power
*.node[*].cellularNic.nrPhy.enableD2D = false # Disable V2V communication

# --- Channel Model (must be the same as gNodeB) ---
*.node[*].cellularNic.LteChannelModelType = "NRChannelModel_3GPP38_901" # or "LteRealisticChannelModel"
*.node[*].cellularNic.nrChannelModel.scenario = "URBAN_MACROCELL" # For V2X configurations
*.node[*].cellularNic.nrChannelModel.shadowing = true
*.node[*].cellularNic.nrChannelModel.fading = true

# --- MAC Layer ---
*.node[*].cellularNic.nrMac.schedulingDisciplineUl = "MAXCI" # Maximum CQI (Channel Quality Indicator)
*.node[*].cellularNic.nrMac.schedulingDisciplineDl = "MAXCI"

# # -- Handover Configuration --
# # Useful for multi-cell configurations
# Transfer to another cell in multi-cells configurations
# # *.node[*].cellularNic.nrPhy.enableHandover = true
# # *.node[*].cellularNic.nrPhy.handoverLatency = 50ms
