# ==============================================================================
# SIMU5G CELLULAR PARAMETERS
# Default settings for 5G gNB and UE (vehicle) configurations
# Same parameters are leagacy compatible with 4G/LTE configurations
# ==============================================================================

[General] # - Default Urban Macrocell Configuration
# ==============================================================================
# gNB 5G Configuration (default settings defined in simu5g/nodes/NR/gNodeB.ned)
# ==============================================================================
# -- Positioning Configuration --
*.gNB.mobility.initFromDisplayString = false
*.gNB.mobility.initialX = 300m
*.gNB.mobility.initialY = 300m

# --- Cell Identity ---
*.gNB.macCellId = 1
*.gNB.macNodeId = 1
*.gNB.cellInfo.broadcastMessageInterval = 1s

# --- Physical Layer ---
*.gNB.cellularNic.nrPhy.carrierFrequency = 2GHz
*.gNB.cellularNic.nrPhy.numerologyIndex = 0
*.gNB.cellularNic.nrPhy.bandwidth = 100MHz
*.gNB.cellularNic.nrPhy.txPower = 46dBm

# -- Channel Model --
*.gNB.cellularNic.LteChannelModelType = "NRChannelModel_3GPP38_901" # or "LteRealisticChannelModel"
*.gNB.cellularNic.nrChannelModel.scenario = "URBAN_MACROCELL" # For V2X conigurations
*.gNB.cellularNic.nrChannelModel.fading = true
*.gNB.cellularNic.nrChannelModel.shadowing = true
*.gNB.cellularNic.nrChannelModel.enableAttenuation = true

# --- MAC Layer ---
*.gNB.cellularNic.nrMac.schedulingDisciplineUl = "MAXCI" # Maximum CQI (Channel Quality Indicator)
*.gNB.cellularNic.nrMac.schedulingDisciplineDl = "MAXCI"

# ==============================================================================
# 5G UPF CONFIGURATION
# ==============================================================================
*.upf.numOfSide = 1
*.upf.upfFilterMode = "ALL" # filter mode: ALL, TCP, UDP

# ==============================================================================
# ALTERNATIVE CONFIGURATIONS
# ==============================================================================
# [HighwayConfig] - Highway Rural Macrocell Configuration
# *.gNB.cellularNic.nrPhy.carrierFrequency = 700MHz # Lower frequency for highway scenario
# *.gNB.cellularNic.nrChannelModel.scenario = "RURAL_MACROCELL" # Rural Macrocell Scenario
# *.gNB.cellularNic.nrPhy.txPower = 49dBm # Higher Tx Power for rural scenario

