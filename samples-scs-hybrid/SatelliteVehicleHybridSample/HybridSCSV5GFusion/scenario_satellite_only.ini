# ==============================================================================
# SCENARIO: SATELLITE ONLY
# HybridCar using only satellite network (Cellular disabled)
# ==============================================================================

[Config SatelliteOnly]
description = "HybridCar: Satellite Only"

# ==============================================================================
# VEINS MANAGER
# ==============================================================================
# *.manager.moduleType = "scs_optional.veins_inet_scs.HybridCarV2X"
*.manager.moduleType = "SatelliteVehicleHybridSample.HybridSCSV5GFusion.HybridCarV2X"
# *.manager.updateInterval = 0.2s

# ==============================================================================
# INTERFACE CONFIGURATION
# ==============================================================================
# Enable satellite, Disable cellular and use only WLAN
*.node[*].numWlanInterfaces = 1
*.node[*].hasCellular = false
*.node[*].ipv4.configurator.interfaces = "wlan0"

# *.numUe = 0 #! To check if needed to disable cellular
# ==============================================================================
# SATELLITE CONFIGURATION
# ==============================================================================
*.satellite[*].forwarding = true  
*.satellite[*].ipv4.forwarding = true

# ==============================================================================
# NETWORK CONFIGURATOR
# ==============================================================================
*.configurator.config = xmldoc("netconfig_satellite.xml")
# *.configurator.config = xmldoc("netconfig_satellite_option2.xml")

# *.configurator.updateInterval = 1s
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "dumps/dump_sat.xml" # Output network config dump file

# =============================================================================
# UPDATE INTERVALS (OVERRIDE DEFAULTS)
# ==============================================================================
# Veins Manager (vehicle) mobility update interval (Default: 0.2s)
*.manager.updateInterval = 0.2s

# Satellite and MCC mobility update interval
*.satellite[*].mobility.updateInterval = 1s # Default: 1s (Satellites move fast)
*.MCC[*].mobility.updateInterval = 200s # Default: 200s (MCCs are static)

# General Mobility Update (Default: 0.1s)
**.updateInterval = 0.1s

# Configurator IP update interval
*.configurator.updateInterval = 1s

# ==============================================================================
# APPLICATION CONFIGURATION - PING
# ==============================================================================
# Server
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

# Nodes - Staggered ping to avoid collisions
*.node[*].numApps = 1
*.node[*].app[0].typename = "PingApp"
*.node[*].app[0].destAddr = "server"
*.node[*].app[0].localPort = 5000 + ancestorIndex(0)
*.node[*].app[0].printPing = true

*node[*].app[0].sendInterval = 4s # Ping interval
*.node[*].app[0].startTime = 5s + ancestorIndex(0) * 2s  # 2s offset per vehicle

# ==============================================================================
# SCENARIO: SATELLITE BURST TRAFFIC
# Burst data upload via satellite
# ==============================================================================

[Config SatelliteOnlyBurstTraffic]
extends = SatelliteOnly
description = "Burst data upload via satellite"

# ==============================================================================
# APPLICATION CONFIGURATION - BURST TRAFFIC
# ==============================================================================
# Server
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000

# Nodes - Burst pattern with large chunks
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].messageLength = 8192B  # 8KB chunks
*.node[*].app[0].sendInterval = exponential(500ms)  # Burst pattern

# Each node bursts at different times
*.node[*].app[0].startTime = 5s + ancestorIndex(0) * 2s  # 2s offset per vehicle

# ==============================================================================
# SCENARIO: SATELLITE TELEMETRY VARIABLE
# Variable rate vehicular telemetry via satellite
# ==============================================================================
[Config SatelliteOnlyVehicleTelemetryVariable]
extends = SatelliteOnly
description = "Variable rate vehicular telemetry"
# ==============================================================================
# APPLICATION CONFIGURATION - VARIABLE TELEMETRY
# ==============================================================================
# Server
*.server.numApps = 1
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 5000
# Nodes - Variable payload and exponential interval
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "server"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].messageLength = intuniform(256B, 1024B)  # Variable payload

*.node[*].app[0].sendInterval = exponential(1s)  # Exponential interval
*.node[*].app[0].startTime = 5s + ancestorIndex(0) * 2s  # 2s offset per vehicle

# ==============================================================================