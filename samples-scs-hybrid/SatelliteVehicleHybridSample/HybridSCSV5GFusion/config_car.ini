# ==============================================================================
# VEHICLE CONFIGURATION
# Settings for Veins/SUMO vehicles with FDMA (2 channels, up to 50 vehicles)
# ==============================================================================

[General]
# ==============================================================================
# VEINS MANAGER
# ==============================================================================
*.manager.updateInterval = 0.2s

# ==============================================================================
# VEHICLE MOBILITY
# ==============================================================================
*.node[*].mobility.typename = "VeinsInetMobility"
*.node[*].mobility.initFromDisplayString = false

# ==============================================================================
# VEHICLE INTERFACES
# ==============================================================================
*.node[*].numWlanInterfaces = 1

#! To check
*.node[*].forwarding = false
*.node[*].ipv4.forwarding = false
# ==============================================================================
# VEHICLE CELLULAR CONFIGURATION (5G/LTE UE)
# ==============================================================================
# Node Type & Identification
*.node[*].nodeType = "UE"

# Cell Association (Single Cell Scenario: All vehicles connect to the same eNodeB cell)
*.node[*].macNodeId = ancestorIndex(0)
*.node[*].masterId = 1
*.node[*].macCellId = 1

# Cell 5G Association (Single Cell Scenario: All vehicles connect to the same gNodeB cell)
*.node[*].nrMacNodeId = ancestorIndex(0)
*.node[*].nrMacCellId = 1
*.node[*].nrMasterId = 1

# Cellular Network Interface (5G/LTE UE)
*.node[*].cellularNic.d2dCapable = true
*.node[*].cellularNic.dualConnectivityEnabled = false

# ==============================================================================
# VEHICLE ENERGY HARDWARE 
# ==============================================================================
# Enable tracking of energy status for all vehicles
*.node[*].hasStatus = true

# Congiguration Virtual Energy Storage (Battery)
*.node[*].energyStorage.typename = "SimpleEpEnergyStorage"
*.node[*].energyStorage.nominalCapacity = 300J
*.node[*].energyStorage.initialCapacity = 300J

# Configuration Virtual Energy Management
*.node[*].energyManagement.typename = "SimpleEpEnergyManagement"
*.node[*].energyManagement.nodeShutdownCapacity = 0J
*.node[*].energyManagement.nodeStartCapacity = 10J

# ==============================================================================
# VEHICLE SATELLITE INTERFACE - MAC LAYER (Layer 2)
# ==============================================================================
*.node[*].wlan[0].mac.bitrate = 20Mbps
*.node[*].wlan[0].mac.slotTime = 9us # 9us # Time slot duration
*.node[*].wlan[0].mac.cwMin = 15 # 15 # Minimum contention window
*.node[*].wlan[0].mac.cwMax = 1023 # 1023 # Maximum contention window

# Optional MAC Parameters
*.node[*].wlan[0].mac.mtu = 32000
*.node[*].wlan[0].mac.useAck = false
# *.node[*].wlan[0].mac.retryLimit = 7 # Maximum number of retransmission attempts before dropping a packet
*.node[*].wlan[0].mac.fullDuplex = true
*.node[*].wlan[0].queue.packetCapacity = -1
# *.node[*].wlan[0].queue.frameCapacity = 200

# ==============================================================================
# VEHICLES 0-24: SERVICE LINK CHANNEL 0 @ 10.825 GHz
# ==============================================================================
*.node[0..49].wlan[0].radio.channelNumber = 0
*.node[0..49].wlan[0].radio.radioMediumModule = "radioMediumSV[0]"
*.node[0..49].wlan[0].radio.centerFrequency = 10.825GHz
*.node[0..49].wlan[0].radio.bandwidth = 250MHz
*.node[0..49].wlan[0].bitrate = 20Mbps

# SERVICE LINK CH0 UPLINK 14.250GHz (Vehicle 0-24 -> Satellite): Transmitter
*.node[0..49].wlan[0].radio.transmitter.centerFrequency = 14.250GHz
*.node[0..49].wlan[0].radio.transmitter.bandwidth = 250MHz
*.node[0..49].wlan[0].radio.transmitter.bitrate = 20Mbps
*.node[0..49].wlan[0].radio.transmitter.power = 10W
*.node[0..49].wlan[0].radio.transmitter.preambleDuration = 1us
*.node[0..49].wlan[0].radio.transmitter.headerLength = 8B
*.node[0..49].wlan[0].radio.transmitter.modulation = "QAM-16"

# SERVICE LINK CH0 DOWNLINK 10.825GHz (Satellite -> Vehicle 0-24): Receiver
*.node[0..49].wlan[0].radio.receiver.centerFrequency = 10.825GHz
*.node[0..49].wlan[0].radio.receiver.bandwidth = 250MHz
*.node[0..49].wlan[0].radio.receiver.bitrate = 150Mbps
*.node[0..49].wlan[0].radio.receiver.snirThreshold = 4dB
*.node[0..49].wlan[0].radio.receiver.sensitivity = -85dBm
*.node[0..49].wlan[0].radio.receiver.energyDetection = -85dBm
*.node[0..49].wlan[0].radio.receiver.modulation = "QAM-16"

# Vehicles 0-24 Antenna Configuration
*.node[0..49].wlan[0].radio.antenna.typename = "ConstantGainAntenna"
*.node[0..49].wlan[0].radio.antenna.mobilityModule = "^.^.^.mobility"
*.node[0..49].wlan[0].radio.antenna.gain = 28dB

# Vehicles 0-24 Antenna Mobility
*.node[0..49].wlan[0].radio.antenna.mobility.typename = "AttachedMobility"
*.node[0..49].wlan[0].radio.antenna.mobility.mobilityModule = "^.^.^.^.mobility"
*.node[0..49].wlan[0].radio.antenna.mobility.offsetX = 0m
*.node[0..49].wlan[0].radio.antenna.mobility.offsetY = 0m
*.node[0..49].wlan[0].radio.antenna.mobility.offsetZ = 1.5m
*.node[0..49].wlan[0].radio.antenna.mobility.initialElevation = 90deg

# ==============================================================================
# VEHICLES 25-49: SERVICE LINK CHANNEL 1 @ 11.075 GHz
# ==============================================================================
*.node[50..99].wlan[0].radio.channelNumber = 1
*.node[50..99].wlan[0].radio.radioMediumModule = "radioMediumSV[1]"
*.node[50..99].wlan[0].radio.centerFrequency = 11.075GHz
*.node[50..99].wlan[0].radio.bandwidth = 250MHz
*.node[50..99].wlan[0].bitrate = 20Mbps
# SERVICE LINK CH1 UPLINK 14.500GHz (Vehicle 25-49 -> Satellite): Transmitter
*.node[50..99].wlan[0].radio.transmitter.centerFrequency = 14.500GHz
*.node[50..99].wlan[0].radio.transmitter.bandwidth = 250MHz
*.node[50..99].wlan[0].radio.transmitter.bitrate = 20Mbps
*.node[50..99].wlan[0].radio.transmitter.power = 10W
*.node[50..99].wlan[0].radio.transmitter.preambleDuration = 1us
*.node[50..99].wlan[0].radio.transmitter.headerLength = 8B
*.node[50..99].wlan[0].radio.transmitter.modulation = "QAM-16"

# SERVICE LINK CH1 DOWNLINK 11.075GHz (Satellite -> Vehicle 25-49): Receiver
*.node[50..99].wlan[0].radio.receiver.centerFrequency = 11.075GHz
*.node[50..99].wlan[0].radio.receiver.bandwidth = 250MHz
*.node[50..99].wlan[0].radio.receiver.bitrate = 150Mbps
*.node[50..99].wlan[0].radio.receiver.snirThreshold = 4dB
*.node[50..99].wlan[0].radio.receiver.sensitivity = -85dBm
*.node[50..99].wlan[0].radio.receiver.energyDetection = -85dBm
*.node[50..99].wlan[0].radio.receiver.modulation = "QAM-16"

# Vehicles 25-49 Antenna Configuration
*.node[50..99].wlan[0].radio.antenna.typename = "ConstantGainAntenna"
*.node[50..99].wlan[0].radio.antenna.mobilityModule = "^.^.^.mobility"
*.node[50..99].wlan[0].radio.antenna.gain = 28dB

# Vehicles 25-49 Antenna Mobility
*.node[50..99].wlan[0].radio.antenna.mobility.typename = "AttachedMobility"
*.node[50..99].wlan[0].radio.antenna.mobility.mobilityModule = "^.^.^.^.mobility"
*.node[50..99].wlan[0].radio.antenna.mobility.offsetX = 0m
*.node[50..99].wlan[0].radio.antenna.mobility.offsetY = 0m
*.node[50..99].wlan[0].radio.antenna.mobility.offsetZ = 1.5m
*.node[50..99].wlan[0].radio.antenna.mobility.initialElevation = 90deg
# ==============================================================================
# VISUALIZATION
# ==============================================================================
*.node[*].wlan[0].radio.displayCommunicationRange = true