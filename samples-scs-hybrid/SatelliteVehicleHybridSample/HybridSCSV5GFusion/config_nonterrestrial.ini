# ==============================================================================
# SATELLITE COMMUNICATION SIMULATION - CONFIGURATION FILE
# Hybrid Terrestrial-Non-Terrestrial Network (TN-NTN)
# ==============================================================================

[General]
# ==============================================================================
# NETWORK TOPOLOGY - NUMBER OF NODES
# ==============================================================================
**.numOfMCCs = 1                # Number of Mission Control Centers
**.numOfCars = 0                #! Check: Number of Ground Stations (GS/Node)
**.numOfSats = 1                #! Number of Satellites
**.numOfServiceLinkChannels = 2 # Number of Service Link Channels (FDMA)

# ==============================================================================
# GENERAL INTERFACE CONFIGURATION
# ==============================================================================
**.numBeamInterfaces = 3        #! Check if necessary
**.numSubChannels = 1           #! Check if necessary
**.updateInterval = 0.1s        # General update interval for all mobility modules, if not overridden

# ==============================================================================
# NETWORK CONFIGURATOR & ROUTING
# ==============================================================================
**.networkConfiguratorModule = "configurator"

*.configurator.addStaticRoutes = true
*.configurator.optimizeRoutes = false
*.configurator.addDefaultRoutes = false
*.configurator.enableInterSatelliteLinks = false

# ==============================================================================
# NETWORK LAYER (IPv4/ARP)
# ==============================================================================
*.*.ipv4.arp.typename = "Arp"
*.*.ipv4.routingTable.netmaskRoutes = ""
*.*.forwarding = true

# ==============================================================================
# MISSION CONTROL CENTER (MCC) CONFIGURATION
# ==============================================================================
# MCC Location
*.MCC[*].cityName = "Fukuoka"
*.MCC[*].mobility.latitude = 33.591
*.MCC[*].mobility.longitude = 130.4006

# MCC Interfaces
*.MCC[*].numEthInterfaces = 1

# MCC Mobility
*.MCC[*].mobility.typename = "GroundStationMobility"
*.MCC[*].mobility.updateInterval = 200s
*.MCC[*].mobility.initFromDisplayString = false

# MCC MAC Layer (Feeder Link: GS<->Sat @ 28.5GHz)
*.MCC[*].wlan[*].typename = "WirelessInterface"
*.MCC[*].wlan[*].mac.typename = "CsmaCaMac"
*.MCC[*].wlan[*].mac.bitrate = 500Mbps
*.MCC[*].wlan[*].mac.mtu = 32000
*.MCC[*].wlan[*].mac.fullDuplex = false # Half-Duplex (GS<->Sat)
*.MCC[*].wlan[*].mac.useAck = false
*.MCC[*].wlan[*].mac.slotTime = 9us
*.MCC[*].wlan[*].mac.cwMin = 15
*.MCC[*].wlan[*].mac.cwMax = 1023
*.MCC[*].wlan[*].mac.retryLimit = 7
*.MCC[*].wlan[*].queue.typename = "DropTailQueue"
*.MCC[*].wlan[*].queue.packetCapacity = 1000

# MCC Physical Layer (Feeder Link @ 28.5GHz)
*.MCC[*].wlan[*].radio.radioMediumModule = "radioMediumFL"
*.MCC[*].wlan[*].radio.centerFrequency = 28.5GHz
*.MCC[*].wlan[*].radio.bandwidth = 500MHz
*.MCC[*].**.bitrate = 500Mbps

# UPLINK: MCC Transmitter
*.MCC[*].wlan[*].radio.transmitter.centerFrequency = 28.5GHz
*.MCC[*].wlan[*].radio.transmitter.bandwidth = 500MHz
*.MCC[*].wlan[*].radio.transmitter.bitrate = 500Mbps
*.MCC[*].wlan[*].radio.transmitter.preambleDuration = 1us
*.MCC[*].wlan[*].radio.transmitter.headerLength = 8B
*.MCC[*].wlan[*].radio.transmitter.power = 251W

# DOWNLINK: MCC Receiver
*.MCC[*].wlan[*].radio.receiver.centerFrequency = 28.5GHz
*.MCC[*].wlan[*].radio.receiver.bandwidth = 500MHz
*.MCC[*].wlan[*].radio.receiver.snirThreshold = 4dB
*.MCC[*].wlan[*].radio.receiver.sensitivity = -85dBm
*.MCC[*].wlan[*].radio.receiver.energyDetection = -85dBm

# MCC Antenna & Modulation
*.MCC[*].wlan[0].radio.antenna.typename = "ConstantGainAntenna"
*.MCC[*].wlan[0].radio.antenna.gain = 65.5dB
*.MCC[0].wlan[*].radio.*.modulation = "QAM-256"

# MCC Display Settings
*.MCC[*].wlan[*].radio.displayCommunicationRange = true

# ==============================================================================
# SATELLITE CONFIGURATION
# ==============================================================================
# Satellite Interfaces
*.satellite[*].numBeamInterfaces = 3 # numOfChannels + 1 (1 FL + 2 SV)
*.satellite[*].numSubChannels = 1
*.satellite[*].numWlanInterfaces = 3 # cnl[0]=FL, cnl[1]=SV_CH0, cnl[2]=SV_CH1
*.satellite[*].bm.numBeamInterfaces = 3
*.satellite[*].bm.numSubChannels = 1

# Satellite Orbit & TLE Configuration
*.satellite[*].satelliteName = "STARLINK-3308"
*.satellite[*].NoradModule.TLEfile = "starlink2023.txt"
*.satellite[*].NoradModule.satIndex = parentIndex()
*.satellite[*].NoradModule.satName = "sat"
*.satellite[*].NoradModule.planes = 2
*.satellite[*].NoradModule.satPerPlane = 66

# Target Date and Time for Position Calculation
*.satellite[*].mobility.targetyear = 123
*.satellite[*].mobility.targetmonth = 2
*.satellite[*].mobility.targetday = 2
*.satellite[*].mobility.targethour = 12
*.satellite[*].mobility.targetsec = 10
*.satellite[*].mobility.targetwday = 4
*.satellite[*].mobility.targetyday = 60
*.satellite[0].mobility.targetmin = 8

*.satellite[*].mobility.enableRepeatCycle = 1
*.satellite[*].mobility.cycleTime = 360

#! *.satellite[1].mobility.targetmin = 11
#! *.satellite[2].mobility.targetmin = 14

# Satellite Mobility
*.satellite[*].mobility.typename = "SatelliteMobilityScs"
*.satellite[*].mobility.updateInterval = 1s
*.satellite[*].mobility.initFromDisplayString = false

# Satellite Forwarding (Enable routing capabilities)
*.satellite[*].forwarding = true
*.satellite[*].ipv4.forwarding = true

# ==============================================================================
# SATELLITE FEEDER LINK: cnl[0] (GS<->Sat @ 28.5GHz)
# ==============================================================================
*.satellite[*].cnl[0].typename = "WirelessInterface"

# MAC Layer Configuration
*.satellite[*].cnl[0].mac.typename = "CsmaCaMac"
*.satellite[*].cnl[0].mac.bitrate = 500Mbps
*.satellite[*].cnl[0].mac.mtu = 32000
*.satellite[*].cnl[0].mac.fullDuplex = false # Half-Duplex (GS<->Sat)
*.satellite[*].cnl[0].mac.useAck = false
*.satellite[*].cnl[0].mac.slotTime = 9us
*.satellite[*].cnl[0].mac.cwMin = 15
*.satellite[*].cnl[0].mac.cwMax = 1023
*.satellite[*].cnl[0].mac.retryLimit = 7
*.satellite[*].cnl[0].queue.typename = "DropTailQueue"
*.satellite[*].cnl[0].queue.packetCapacity = 1000

# Physical Layer Configuration
*.satellite[*].cnl[0].radio.radioMediumModule = "radioMediumFL"
*.satellite[*].cnl[0].radio.centerFrequency = 28.5GHz
*.satellite[*].cnl[0].radio.bandwidth = 500MHz
*.satellite[0].cnl[0].bitrate = 500Mbps

# DOWNLINK: Satellite cnl[0] Transmitter
*.satellite[*].cnl[0].radio.transmitter.centerFrequency = 28.5GHz
*.satellite[*].cnl[0].radio.transmitter.bandwidth = 500MHz
*.satellite[*].cnl[0].radio.transmitter.bitrate = 500Mbps
*.satellite[*].cnl[0].radio.transmitter.preambleDuration = 1us
*.satellite[*].cnl[0].radio.transmitter.headerLength = 8B
*.satellite[*].cnl[0].radio.transmitter.power = 15W

# UPLINK: Satellite cnl[0] Receiver
*.satellite[*].cnl[0].radio.receiver.centerFrequency = 28.5GHz
*.satellite[*].cnl[0].radio.receiver.bandwidth = 500MHz
*.satellite[*].cnl[0].radio.receiver.snirThreshold = 4dB
*.satellite[*].cnl[0].radio.receiver.sensitivity = -100dBm
*.satellite[*].cnl[0].radio.receiver.energyDetection = -85dBm

# Antenna & Modulation
*.satellite[*].cnl[0].radio.antenna.typename = "ConstantGainAntenna"
*.satellite[*].cnl[0].radio.antenna.gain = 34dB
*.satellite[*].cnl[0].radio.*.modulation = "QAM-256"

# Display Settings
*.satellite[*].cnl[*].radio.displayCommunicationRange = true

# ==============================================================================
# SATELLITE SERVICE LINKS: cnl[1] and cnl[2] (Sat<->Vehicle) - COMMON CONFIG
# ==============================================================================
*.satellite[*].cnl[1..2].typename = "WirelessInterface"

# MAC Layer Configuration (Common for both channels)
*.satellite[*].cnl[1..2].mac.typename = "CsmaCaMac"
*.satellite[*].cnl[1..2].mac.bitrate = 150Mbps # Service Link: 150Mbps
*.satellite[*].cnl[1..2].mac.mtu = 32000
*.satellite[*].cnl[1..2].mac.fullDuplex = true # Full-Duplex (Sat<->Vehicle)
*.satellite[*].cnl[1..2].mac.useAck = false
*.satellite[*].cnl[1..2].mac.slotTime = 1us
*.satellite[*].cnl[1..2].mac.cwMin = 0 # No Backoff
*.satellite[*].cnl[1..2].mac.cwMax = 0 # No Backoff
*.satellite[*].cnl[1..2].mac.retryLimit = 0 # No Retransmissions
*.satellite[*].cnl[1..2].queue.typename = "DropTailQueue"
*.satellite[*].cnl[1..2].queue.packetCapacity = 1000

# ==============================================================================
# SATELLITE SERVICE LINK CHANNEL 0: cnl[1] @ 10.825 GHz
# ==============================================================================
*.satellite[*].cnl[1].radio.channelNumber = 0
*.satellite[*].cnl[1].radio.radioMediumModule = "radioMediumSV[0]"
*.satellite[*].cnl[1].radio.centerFrequency = 10.825GHz
*.satellite[*].cnl[1].radio.bandwidth = 250MHz
*.satellite[*].cnl[1].bitrate = 150Mbps

# DOWNLINK: Satellite cnl[1] Transmitter (10.825 GHz)
*.satellite[*].cnl[1].radio.transmitter.centerFrequency = 10.825GHz
*.satellite[*].cnl[1].radio.transmitter.bandwidth = 250MHz
*.satellite[*].cnl[1].radio.transmitter.bitrate = 150Mbps
*.satellite[*].cnl[1].radio.transmitter.preambleDuration = 1us
*.satellite[*].cnl[1].radio.transmitter.headerLength = 8B
*.satellite[*].cnl[1].radio.transmitter.power = 15W

# UPLINK: Satellite cnl[1] Receiver (14.250 GHz)
*.satellite[*].cnl[1].radio.receiver.centerFrequency = 14.250GHz
*.satellite[*].cnl[1].radio.receiver.bandwidth = 250MHz
*.satellite[*].cnl[1].radio.receiver.bitrate = 20Mbps
*.satellite[*].cnl[1].radio.receiver.snirThreshold = 4dB
*.satellite[*].cnl[1].radio.receiver.sensitivity = -100dBm
*.satellite[*].cnl[1].radio.receiver.energyDetection = -85dBm

# Antenna & Modulation
*.satellite[*].cnl[1].radio.antenna.typename = "ConstantGainAntenna"
*.satellite[*].cnl[1].radio.antenna.gain = 34dB
*.satellite[*].cnl[1].radio.*.modulation = "QAM-16"
*.satellite[*].cnl[1].mediumLimitCache.centerFrequency = 10.825GHz

# ==============================================================================
# SATELLITE SERVICE LINK CHANNEL 1: cnl[2] @ 11.075 GHz
# ==============================================================================
*.satellite[*].cnl[2].radio.channelNumber = 1
*.satellite[*].cnl[2].radio.radioMediumModule = "radioMediumSV[1]"
*.satellite[*].cnl[2].radio.centerFrequency = 11.075GHz
*.satellite[*].cnl[2].radio.bandwidth = 250MHz
*.satellite[*].cnl[2].bitrate = 150Mbps

# DOWNLINK: Satellite cnl[2] Transmitter (11.075 GHz)
*.satellite[*].cnl[2].radio.transmitter.centerFrequency = 11.075GHz
*.satellite[*].cnl[2].radio.transmitter.bandwidth = 250MHz
*.satellite[*].cnl[2].radio.transmitter.bitrate = 150Mbps
*.satellite[*].cnl[2].radio.transmitter.preambleDuration = 1us
*.satellite[*].cnl[2].radio.transmitter.headerLength = 8B
*.satellite[*].cnl[2].radio.transmitter.power = 15W

# UPLINK: Satellite cnl[2] Receiver (14.500 GHz)
*.satellite[*].cnl[2].radio.receiver.centerFrequency = 14.500GHz
*.satellite[*].cnl[2].radio.receiver.bandwidth = 250MHz
*.satellite[*].cnl[2].radio.receiver.bitrate = 20Mbps
*.satellite[*].cnl[2].radio.receiver.snirThreshold = 4dB
*.satellite[*].cnl[2].radio.receiver.sensitivity = -100dBm
*.satellite[*].cnl[2].radio.receiver.energyDetection = -85dBm

# Antenna & Modulation
*.satellite[*].cnl[2].radio.antenna.typename = "ConstantGainAntenna"
*.satellite[*].cnl[2].radio.antenna.gain = 34dB
*.satellite[*].cnl[2].radio.*.modulation = "QAM-16"
*.satellite[*].cnl[2].mediumLimitCache.centerFrequency = 11.075GHz

# ==============================================================================
# RADIO MEDIUM CONFIGURATION
# ==============================================================================
# Feeder Link Radio Medium (28.5 GHz)
**.radioMediumFL.listeningFilter = false
**.radioMediumFL.pathLoss.typename = "SatellitePathloss"
**.radioMediumFL.pathLoss.plConfig = xmldoc("plConfig.xml")
**.radioMediumFL.backgroundNoise.power = -90dBm

# Service Link Radio Medium Channel 0 (10.825 GHz)
**.radioMediumSV[0].listeningFilter = false
**.radioMediumSV[0].pathLoss.typename = "SatellitePathloss"
**.radioMediumSV[0].pathLoss.plConfig = xmldoc("plConfig.xml")
**.radioMediumSV[0].backgroundNoise.power = -90dBm

# Service Link Radio Medium Channel 1 (11.075 GHz)
**.radioMediumSV[1].listeningFilter = false
**.radioMediumSV[1].pathLoss.typename = "SatellitePathloss"
**.radioMediumSV[1].pathLoss.plConfig = xmldoc("plConfig.xml")
**.radioMediumSV[1].backgroundNoise.power = -90dBm

# General Radio Settings
**.analogModel.ignorePartialInterference = true

# ==============================================================================
# VISUALIZATION
# ==============================================================================
# General Visualizer Settings
*.visualizer.dataLinkVisualizer.packetFilter = "UDP*"
*.visualizer.mobilityVisualizer.typename = "BeamVisualizer"

# Network Route Visualization
*.visualizer.networkRouteVisualizer.displayRoutes = true
*.visualizer.networkRouteVisualizer.packetFilter = "*"
*.visualizer.routingTableVisualizer.destinationFilter = "*"

# Statistic Visualization
*.visualizer.statisticVisualizer.sourceFilter = "**.app[*]"
*.visualizer.statisticVisualizer.signalName = "rtt"
*.visualizer.statisticVisualizer.unit = "s"
*.visualizer.statisticVisualizer.animationSpeed = 2

# Mobility Visualization
*.visualizer.mobilityVisualizer.displayPositions = true
*.visualizer.mobilityVisualizer.positionCircleLineWidth = 2
*.visualizer.mobilityVisualizer.positionCircleRadius = 80
*.visualizer.mobilityVisualizer.displayVelocities = true
*.visualizer.mobilityVisualizer.displayOrientations = true