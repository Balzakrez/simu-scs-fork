# ==============================================================================
# CELLULAR NETWORK CONFIGURATION
# 5G/LTE Infrastructure and User Equipment Settings
# ==============================================================================
# Cellular Capacity (Offered Load) Calculation
# =============================================================================
# Throughput = Bandwidth * Efficiency
# Bandwidth = numRB * RBsize
# Efficiency = 1 bps/Hz (conservative estimate for urban environment with moderate interference
# Efficiency can vary based on channel conditions, modulation schemes, and coding rates)
# TroughputTot = numRB * RBsize * Duration * Efficiency
# Duration = 1s (in standard 4G LTE, for calculating offered load per second)
# RBsize = 180kHz
# Duration = 1000ms = 1s
# ThroughputTot = numRB * 180kHz * 1s * 1 bps/Hz = numRB * 180 kbps
# For numRB = 50 -> ThroughputTot = 50 * 180 * 1s * 1bps = 9000 kbps = 9 Mbps
# For numRB = 15 -> ThroughputTot = 15 * 180 * 1s * 1bps = 2700 kbps = 2.7 Mbps
# =============================================================================
# Cellular Traffic Load Calculation
# ==============================================================================
# N = 100 nodes
# T = sendInterval = 100ms = 0.1s
# frequency = 1 / T = 10 packets per second
# Dpkt = 1024B (playload) + 8B (UDP header) + 20B (IP header) = 1052B 
# Simu5G adds overhead ~ 20B (RLC, PDCP, MAC, ..)
# Dtot = Dpkt + 20B = 1072B
# BitRate = Dtot * 8 * frequency = 1072B * 8 * 10 = 85.76 kbps (single node)
# TotalBitRate = N * BitRate = 100 * 85.76 kbps = 8.576 Mbps
# ==============================================================================

# Note: numBands = Number of Resource Blocks (RB) in a Single Cell
# 1RB = 180kHz 

# **.numBands = 50 # 50RB x 180kHZ = 9MHz ()
**.numBands = 15 # 15RB x 180kHZ = 2.7MHz (for testing with fewer resources)


#! Configurazione Scheduler
# Note: MAXCI: Maximum Carrier to Interference
# Assegna le risorse (Resource Blocks) agli utenti che hanno il canale radio migliore (miglior SINR).
# - I veicoli vicini all'antenna (o con visuale libera) prenderanno tutta la banda. 
# - I veicoli lontani o ostacolati andranno in starvation (non trasmetteranno nulla).
# Risultato sui dati: Potresti vedere un Throughput totale alto, 
# ma un PDR molto sbilanciato (alcuni nodi al 100%, altri allo 0%).
**.mac.schedulingDisciplineDl = "MAXCI" # Maximum Carrier to Interference Downlink (Default)
**.mac.schedulingDisciplineUl = "MAXCI" # Maximum Carrier to Interference Uplink (Default)


# Note: PF: Proportional Fair
# Bilancia l'efficienza spettrale con l'equità tra gli utenti cercando un compromesso.
# Assegna risorse tenendo conto sia della qualità del canale 
# che della quantità di dati già trasmessi a ciascun utente.
# - I veicoli vicini all'antenna otterranno più risorse,
#   ma i veicoli più lontani o ostacolati riceveranno comunque una parte della banda periodicamente.
# Risultato sui dati: Potresti vedere un Throughput totale leggermente inferiore rispetto a MAXCI,
# ma un PDR più equilibrato tra tutti i nodi.
# **.mac.schedulingDisciplineDl = "PF" # Proportional Fair Downlink
# **.mac.schedulingDisciplineUl = "PF" # Proportional Fair Uplink

# ==============================================================================
# ENODEB (BASE STATION) CONFIGURATION
# ==============================================================================
# eNodeB Mobility & Position
*.eNB.mobility.initFromDisplayString = false
*.eNB.mobility.initialX = 300m
*.eNB.mobility.initialY = 300m

# eNodeB Cell Configuration
*.eNB.macCellId = 1
*.eNB.macNodeId = 1

# eNodeB Network Interface
*.eNB.cellularNic.d2dCapable = false

# ==============================================================================
# PWG/UPF (PACKET GATEWAY / USER PLANE FUNCTION) CONFIGURATION
# ==============================================================================
# Packet Filtering
*.pwg.pwgFilterMode = "ALL" # Filter mode: ALL, TCP, UDP